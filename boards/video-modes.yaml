    horizontal: {total: 1056, sync: 128, back_porch: 88, visible: 800, front_porch: 40, polarity: pos}
    vertical:   {total: 628, sync: 4, back_porch: 23, visible: 600, front_porch: 1, polarity: pos}
    source: "VESA DMT; DE2-115 Tabelas 4-14 e 4-15"
