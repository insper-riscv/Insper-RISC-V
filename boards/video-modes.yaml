# Catalogo de modos de video. Esquema: docs/pt-br/boards/formato.md, secao 4.3.
# Cada modo traz, por eixo, os quatro intervalos do ciclo (sync, back_porch, visible, front_porch) e o total, que e a soma
# dos quatro. Polaridade neg quer dizer pulso de sincronismo em nivel baixo. O clock de pixel esta em MHz.
# Fontes: manuais Terasic (DE0-CV Tabelas 3-8 e 3-9, DE2-115 Tabelas 4-14 e 4-15), VESA DMT e CTA-861 (VIC 4 e VIC 16).
modes:
  640x480@60:
    width: 640
    height: 480
    refresh_hz: 60
    aspect: "4:3"
    pixel_clock_mhz: 25.0
    horizontal: {total: 800, sync: 96, back_porch: 48, visible: 640, front_porch: 16, polarity: neg}
    vertical:   {total: 525, sync: 2, back_porch: 33, visible: 480, front_porch: 10, polarity: neg}
    source: "DE0-CV Tabelas 3-8 e 3-9; DE10-Lite Tabelas 3-9 e 3-10; DE2-115 Tabelas 4-14 e 4-15 (o VESA DMT usa 25,175 MHz)"
  640x480@85:
    width: 640
    height: 480
    refresh_hz: 85
    aspect: "4:3"
    pixel_clock_mhz: 36.0
    horizontal: {total: 832, sync: 56, back_porch: 80, visible: 640, front_porch: 56, polarity: neg}
    vertical:   {total: 509, sync: 3, back_porch: 25, visible: 480, front_porch: 1, polarity: neg}
    source: "VESA DMT; DE2-115 Tabelas 4-14 e 4-15 (linhas em us, vertical em linhas)"
