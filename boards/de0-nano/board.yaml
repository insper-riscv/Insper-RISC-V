# Pacote da Terasic DE0-Nano. Esquema: docs/pt-br/boards/formato.md.
board: de0-nano
name: Terasic DE0-Nano
family: cyclone-iv-e
device: EP4CE22F17C6
speed_grade: C6
target_level: N3
jtag:
  cable: usb-blaster
  chain:
    - {name: "10CL025(Y|Z)/EP3C25/EP4CE22", idcode: "020F30DD", fpga: true, confirmed: measured}
resources:
  logic:       {unit: le, total: 22320}
  block_ram:   {kind: m9k, blocks: 66, bits_per_block: 9216}
  multipliers: {kind: dsp9x9, total: 132}
  plls: 4
  user_pins: 153
clocks:
  inputs:
    - {name: clock_50, signal: CLOCK_50, mhz: 50}
  reference: clock_50
  reset: {signal: "KEY[0]", active: low}
io:
  leds:     {signals: "LED[7:0]", active: high}
  switches: {signals: "DIP[3:0]", active: high}
  keys:     {signals: "KEY[1:0]", active: low}
  gpio:
    signals: ["GPIO_0[33:0]", "GPIO_1[33:0]", "GPIO_2[12:0]"]
    bidirectional: true
memories:
  sdram:
    chip: IS42S16160B-7
    chips: 1
    signals: DRAM
    clk_phase_ps: 7000
  serial_flash:
    chip: EPCS64
    bytes: 8388608
    shared_with_config: true
# Papeis de pino dos perifericos externos (secao `buses`), um por kind de `Peripherals`.
buses:
  adc: {chip: adc128s022, cs_n: ADC_CS_N, sclk: ADC_SCLK, saddr: ADC_SADDR, sdat: ADC_SDAT}
  adxl345: {cs_n: G_SENSOR_CS_N, sclk: I2C_SCLK, mosi: I2C_SDAT, int1: G_SENSOR_INT}
  i2c: {scl: I2C_SCLK, sda: I2C_SDAT}
console:
  default: jtag
pins: pins.yaml
notes:
  - "Polaridades lidas no manual (secao 3.2): o botao KEY da nivel baixo ao ser apertado, o LED acende em nivel alto e a chave DIP da nivel alto na posicao de baixo."
  - "Sem botao de reset dedicado: o reset do SoC e o KEY[0]. Sem display, VGA, SD nem UART; o unico console e a JTAG UART."
  - "O chip da SDRAM (IS42S16160B-7) e inferido de uma porta VHDL de terceiros; o manual so da 16M x 16."
  - "A capacidade do EPCS varia por revisao da placa (EPCS4, EPCS16 ou EPCS64); 8 MiB vale para o manual v1.9 e deve ser conferido pelo ID JEDEC. O EPCS guarda tambem o bitstream (cerca de 0,75 MB)."
  - "Logica, M9K, multiplicadores e PLLs vem de fonte secundaria (listagem de distribuidor); user_pins (153) vem do manual."
  - "Os multiplicadores sao contados em elementos de 9 bits (66 de 18x18)."
  - "Todos os bancos sao 3.3 V. DIP[3:0] leva nivel alto na posicao baixa (manual, secao 3.2, tabela 3-3)."
  - "Expansao (secao 3.5): dois cabecalhos de 40 pinos com GPIO_0 e GPIO_1 (tabelas 3-6 e 3-7), cada um com 36 pinos do FPGA, dos quais 34 sao de E/S (GPIO_0[33:0], GPIO_1[33:0]) e 2 sao so de entrada (GPIO_0_IN[1:0], GPIO_1_IN[1:0]); mais VCC5, VCC33 e dois GND. O cabecalho 2x13 (secao 3.6, tabela 3-8) tem GPIO_2[12:0] de E/S e GPIO_2_IN[2:0] so de entrada, e liga os 8 canais do ADC. O papel gpio numera os 34 de GPIO_0, os 34 de GPIO_1 e os 13 de GPIO_2, nessa ordem; os pinos so de entrada ficam fora do papel porque o Quartus recusa uma celula bidirecional neles (erro 169009)."
  - "ADC128S022 (secao 3.6: ADC_CS_N, ADC_SADDR, ADC_SCLK, ADC_SDAT) e acelerometro ADXL345 (secao 3.7: G_SENSOR_CS_N, G_SENSOR_INT, I2C_SCLK, I2C_SDAT, o I2C da EEPROM) estao em pins.yaml; o esquema ainda nao tem papel de E/S para eles."
  - "A identificacao da placa pelo IDCODE e inferida: 020F30DD e o do EP4CE22, e a DE0-Nano e a unica placa Terasic DE0 com esse dispositivo."
  - "DIP[3:0] e KEY[1] ficam em pinos que o Quartus aceita so como entrada (erro 169009 numa celula de GPIO bidirecional): a plataforma da placa nao pede os papeis switches e keys, e KEY[0] segue como reset."
