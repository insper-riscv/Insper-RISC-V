[project]
name = "rv32-sdk"
version = "0.5.0"
requires-python = ">=3.14,<3.15"
dependencies = ["riscv-tools", "PyYAML>=6.0", "cocotb==2.1.0"]

[project.scripts]
rv32-sdk = "rv32_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rv32_sdk"]

[tool.uv.sources]
riscv-tools = {path = "tools", editable = true}

[tool.ruff]
target-version = "py314"
line-length = 79
exclude = ["tools", ".venv", "platforms", "vendor", "benchmarks/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = ["ruff>=0.14", "deptry>=0.20"]

[tool.deptry]
exclude = ["tools", ".venv", "platforms", "tests", "vendor", "benchmarks/results"]

[tool.deptry.per_rule_ignores]
# Imported by the SDK's generated upstream cocotb testbench, not the CLI package.
DEP002 = ["cocotb"]
