name: Embench reporting tests

on:
  push:
    paths:
      - 'benchmarks/embench/**'
      - '.github/scripts/embench-comment*'
      - '.github/workflows/embench*.yml'
  pull_request:
    paths:
      - 'benchmarks/embench/**'
      - '.github/scripts/embench-comment*'
      - '.github/workflows/embench*.yml'

permissions:
  contents: read

jobs:
  reporting-tests:
    name: Embench score and comment tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'PyYAML>=6.0'
      - run: python -m unittest benchmarks.embench.test_reporting benchmarks.embench.test_score benchmarks.embench.test_workflow_policy
      - run: node --test .github/scripts/embench-comment.test.cjs
