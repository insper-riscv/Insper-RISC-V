name: embench

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compare_ref:
        description: Baseline SHA for an explicit manual main run
        type: string
        default: main
      scope:
        description: Explicit Core profiles, or the complete generated matrix
        type: choice
        options: [named, all]
        default: named
      workload:
        description: One local repetition for CI, or unchanged full Embench loops
        type: choice
        options: [ci, full]
        default: ci

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: embench-${{ github.ref }}
  cancel-in-progress: false

env:
  EMBENCH_IMAGE: ghcr.io/insper-riscv/ci-elf@sha256:69a94e0e42869be2dc14a5174c49eed7cead20afe3282e3ce6c629179ef8aeb8
  EMBENCH_COMMIT: 09c2ed8c3b7008c95d08b038de4a3f6dc103ed70
  BASE_REF: ${{ github.event.before || inputs.compare_ref || '' }}
  CANDIDATE_REF: ${{ github.sha }}
  DRIVER_REF: ${{ github.sha }}
  SCOPE: ${{ inputs.scope || 'named' }}
  WORKLOAD: ${{ inputs.workload || 'ci' }}

jobs:
  eligible:
    name: Confirm merged main update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.merge.outputs.run }}
      pr: ${{ steps.merge.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v8
        id: merge
        with:
          script: |
            const {eligibleMainUpdate} = require('./.github/scripts/embench-comment.cjs');
            await eligibleMainUpdate({github, context, core});

  plan:
    needs: eligible
    if: needs.eligible.outputs.run == 'true'
    env:
      PR_NUMBER: ${{ needs.eligible.outputs.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/insper-riscv/ci-elf@sha256:69a94e0e42869be2dc14a5174c49eed7cead20afe3282e3ce6c629179ef8aeb8
      options: --memory=8g --memory-swap=8g --cpus=2
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      base: ${{ steps.plan.outputs.base }}
      driver: ${{ steps.plan.outputs.driver }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRIVER_REF }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.BASE_REF != ''
        with:
          ref: ${{ env.BASE_REF }}
          path: base
          submodules: recursive
          persist-credentials: false
      - name: Plan profiles from the target YAMLs
        id: plan
        working-directory: driver
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          printf 'driver=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          args=(--candidate "$GITHUB_WORKSPACE/candidate" --scope "$SCOPE" --workload "$WORKLOAD" --output "$GITHUB_WORKSPACE/plan.json")
          if [ -n "$BASE_REF" ]; then
            args+=(--base "$GITHUB_WORKSPACE/base")
            printf 'base=%s\n' "$(git -C "$GITHUB_WORKSPACE/base" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          /opt/riscv-tools/riscv-tools/bin/python -m benchmarks.embench.ci plan "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: embench-plan
          path: plan.json
          retention-days: 14

  measure:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: ghcr.io/insper-riscv/ci-elf@sha256:69a94e0e42869be2dc14a5174c49eed7cead20afe3282e3ce6c629179ef8aeb8
      options: --memory=8g --memory-swap=8g --cpus=2
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BASE_SHA: ${{ needs.plan.outputs.base }}
      PROFILES: ${{ toJSON(matrix.profiles) }}
      PROGRAMS: ${{ toJSON(matrix.programs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.driver }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.BASE_SHA != ''
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: base
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: embench/embench-iot
          ref: ${{ env.EMBENCH_COMMIT }}
          path: upstream
          persist-credentials: false
      - name: Adapter unit tests and memory model equivalence
        working-directory: driver
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          /opt/riscv-tools/riscv-tools/bin/python -m unittest benchmarks.embench.test_reporting -v
          /opt/riscv-tools/riscv-tools/bin/python -m benchmarks.embench.check_storage --root "$GITHUB_WORKSPACE/candidate" --output "$GITHUB_WORKSPACE/results/storage"
          if [ -n "$BASE_SHA" ]; then
            /opt/riscv-tools/riscv-tools/bin/python -m benchmarks.embench.check_storage --root "$GITHUB_WORKSPACE/base" --output "$GITHUB_WORKSPACE/results/storage-base"
          fi
      - name: Check retirement counts on a known assembly kernel
        if: matrix.id == 0
        working-directory: driver
        shell: bash
        run: |
          /opt/riscv-tools/riscv-tools/bin/python -m benchmarks.embench.check_oracle --upstream "$GITHUB_WORKSPACE/upstream" --output "$GITHUB_WORKSPACE/results/oracle"
          /opt/riscv-tools/riscv-tools/bin/python -m benchmarks.embench.check_counter --root "$GITHUB_WORKSPACE/candidate" --upstream "$GITHUB_WORKSPACE/upstream" --output "$GITHUB_WORKSPACE/results/counter"
          if [ -n "$BASE_SHA" ]; then
            /opt/riscv-tools/riscv-tools/bin/python -m benchmarks.embench.check_counter --root "$GITHUB_WORKSPACE/base" --upstream "$GITHUB_WORKSPACE/upstream" --output "$GITHUB_WORKSPACE/results/counter-base"
          fi
      - name: Fingerprint actual inputs on each side
        id: keys
        working-directory: driver
        shell: bash
        run: |
          args=(--candidate "$GITHUB_WORKSPACE/candidate" --profiles "$PROFILES" --programs "$PROGRAMS" --workload "$WORKLOAD")
          if [ -n "$BASE_SHA" ]; then args+=(--base "$GITHUB_WORKSPACE/base"); fi
          /opt/riscv-tools/riscv-tools/bin/python -m benchmarks.embench.ci keys "${args[@]}"
      - uses: actions/cache/restore@v5
        with:
          path: cache/${{ steps.keys.outputs.candidate }}
          key: ${{ steps.keys.outputs.candidate }}
      - uses: actions/cache/restore@v5
        if: env.BASE_SHA != ''
        with:
          path: cache/${{ steps.keys.outputs.base }}
          key: ${{ steps.keys.outputs.base }}
      - name: Run programs serially, verifying every result
        env:
          CANDIDATE_KEY: ${{ steps.keys.outputs.candidate }}
          BASE_KEY: ${{ steps.keys.outputs.base }}
        working-directory: driver
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results"
          for side in candidate base; do
            key="$CANDIDATE_KEY"
            if [ "$side" = base ]; then key="$BASE_KEY"; fi
            if [ -n "$key" ] && [ -d "$GITHUB_WORKSPACE/cache/$key" ]; then
              mkdir -p "$GITHUB_WORKSPACE/results/$side"
              cp -a "$GITHUB_WORKSPACE/cache/$key/." "$GITHUB_WORKSPACE/results/$side/"
            fi
          done
          args=(--candidate "$GITHUB_WORKSPACE/candidate" --profiles "$PROFILES" --programs "$PROGRAMS" --scope "$SCOPE" --workload "$WORKLOAD" --upstream "$GITHUB_WORKSPACE/upstream" --output "$GITHUB_WORKSPACE/results")
          if [ -n "$BASE_SHA" ]; then args+=(--base "$GITHUB_WORKSPACE/base"); fi
          /opt/riscv-tools/riscv-tools/bin/python -m benchmarks.embench.ci execute "${args[@]}"
      - name: Keep small successful result records for reuse
        if: success()
        env:
          CANDIDATE_KEY: ${{ steps.keys.outputs.candidate }}
          BASE_KEY: ${{ steps.keys.outputs.base }}
        shell: bash
        run: |
          for side in candidate base; do
            key="$CANDIDATE_KEY"
            if [ "$side" = base ]; then key="$BASE_KEY"; fi
            if [ -z "$key" ] || [ ! -d "results/$side" ]; then continue; fi
            find "results/$side" -name results.json -print0 | while IFS= read -r -d '' file; do
              relative="${file#results/$side/}"
              target="cache/$key/$relative"
              mkdir -p "$(dirname "$target")"
              cp "$file" "$target"
            done
          done
      - uses: actions/cache/save@v5
        if: success()
        with:
          path: cache/${{ steps.keys.outputs.candidate }}
          key: ${{ steps.keys.outputs.candidate }}
      - uses: actions/cache/save@v5
        if: success() && env.BASE_SHA != ''
        with:
          path: cache/${{ steps.keys.outputs.base }}
          key: ${{ steps.keys.outputs.base }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: embench-batch-${{ matrix.id }}
          path: |
            results/**/results.json
            results/**/counter-check.json
            results/**/oracle-check.json
            results/**/*.log
            results/**/*-scale.json
            results/**/config_pkg.vhd
          if-no-files-found: error
          retention-days: 14

  embench:
    name: Embench results (informational)
    needs: [eligible, plan, measure]
    if: ${{ !cancelled() && needs.eligible.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ needs.plan.outputs.base }}
    container:
      image: ghcr.io/insper-riscv/ci-elf@sha256:69a94e0e42869be2dc14a5174c49eed7cead20afe3282e3ce6c629179ef8aeb8
      options: --memory=2g --memory-swap=2g --cpus=1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.driver }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: embench-plan
          path: plan
      - uses: actions/download-artifact@v8
        with:
          pattern: embench-batch-*
          path: results
          merge-multiple: true
      - name: Publish profile/program tables and PR deltas
        shell: bash
        run: |
          args=(--plan plan/plan.json --output embench-summary.md)
          if [ -n "$BASE_SHA" ]; then args+=(--compare); fi
          /opt/riscv-tools/riscv-tools/bin/python -m benchmarks.embench.ci aggregate --input results "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: embench-summary
          path: |
            embench-summary.md
            embench-score.json
            results/**/*.json
            results/**/*.csv
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: embench-score
          path: embench-score.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report incomplete measurements as a diagnostic failure
        if: always()
        env:
          MEASURE_RESULT: ${{ needs.measure.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          test "$MEASURE_RESULT" = success
          test "$PLAN_RESULT" = success
