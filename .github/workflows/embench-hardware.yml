name: embench-hardware-trusted

# IMPORTANT: the FPGA runner group must allow only this reusable workflow,
# pinned to a full reviewed commit SHA. Never allow arbitrary PR workflows.
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      base_sha:
        type: string
        default: ''
      workload:
        type: string
        default: ci

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Restrict physical execution to maintainer-owned revisions
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          PROFILE: ${{ inputs.profile }}
          WORKLOAD: ${{ inputs.workload }}
        run: |
          python3 - <<'PY'
          import json, os, re
          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              event = json.load(stream)
          if os.environ['GITHUB_REPOSITORY'] != 'insper-riscv/Insper-RISC-V':
              raise SystemExit('Unexpected caller repository')
          if os.environ['GITHUB_EVENT_NAME'] not in {'pull_request', 'workflow_dispatch'}:
              raise SystemExit('Unsupported hardware event')
          base = os.environ['BASE_SHA']
          if base and not re.fullmatch(r'[0-9a-f]{40}', base):
              raise SystemExit('Base must be an immutable commit SHA')
          if 'pull_request' in event:
              if base != event['pull_request']['base']['sha']:
                  raise SystemExit('Incorrect PR base revision')
              if event['pull_request']['head']['repo']['full_name'] != os.environ['GITHUB_REPOSITORY']:
                  raise SystemExit('Fork FPGA validation requires a maintainer-owned review branch')
          if not re.fullmatch(r'rv32i[a-z0-9_]*', os.environ['PROFILE']):
              raise SystemExit('Invalid hardware profile')
          if os.environ['WORKLOAD'] not in {'ci', 'full'}:
              raise SystemExit('Invalid workload')
          PY

  hardware:
    needs: authorize
    runs-on:
      group: FPGA
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f900df938f3408fa9f681f52f44514b64dbe1dca
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        if: inputs.base_sha != ''
        with:
          ref: ${{ inputs.base_sha }}
          path: base
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: embench/embench-iot
          ref: 09c2ed8c3b7008c95d08b038de4a3f6dc103ed70
          path: upstream
          persist-credentials: false
      - name: Compile offline and measure the locked DE0-CV
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          PROFILE: ${{ inputs.profile }}
          WORKLOAD: ${{ inputs.workload }}
        shell: bash
        run: |
          args=(--candidate "$GITHUB_WORKSPACE/candidate" --upstream "$GITHUB_WORKSPACE/upstream" --output "$GITHUB_WORKSPACE/hardware-output" --profile "$PROFILE" --workload "$WORKLOAD")
          if [ -n "$BASE_SHA" ]; then args+=(--base "$GITHUB_WORKSPACE/base"); fi
          python3 "$GITHUB_WORKSPACE/driver/benchmarks/embench/hardware_host.py" "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: embench-fpga-results-${{ inputs.profile }}
          path: hardware-output/results/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: embench-fpga-evidence-${{ inputs.profile }}
          path: |
            hardware-output/**/*.log
            hardware-output/**/hardware-manifest.json
            hardware-output/**/*.sta.summary
            hardware-output/**/*.sta.rpt
            hardware-output/**/*.fit.summary
            hardware-output/**/*.sof
            hardware-output/**/*.elf
          if-no-files-found: error
          retention-days: 14
      - name: Remove only generated job files
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/hardware-output"
