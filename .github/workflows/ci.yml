name: ci

# One run per commit: a pull request (a new commit cancels the run of the previous one) or a push to
# main. The four jobs have fixed names, which a ruleset of the organization can require as checks.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  vhdl-syntax:
    name: vhdl-syntax
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # GHDL, Yosys, SymbiYosys, z3, uv and riscv-tools of insper-riscv/Infra.
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Every referenced path exists, in this repository and in each submodule
        run: make paths

      - name: VHDL syntax check of every repository (GHDL, dependency order)
        run: make check

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Per-entity cocotb tests of each repository and the memory map check
        run: make unit-tests

      - name: Test programs of the Tests repository, in simulation
        run: make sim

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore

  formal:
    name: formal
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prove every make target named formal* of each repository
        # A repository without proofs passes with a message; the proofs join by adding a formal target to it.
        run: make formal

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formal-logs
          path: |
            */build/formal/**/*.log
          if-no-files-found: ignore

  python-static-analysis:
    name: python-static-analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # The tools come pinned in the image, with the settings of [tool.ruff] and [tool.complexipy] of pyproject.toml.
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - uses: actions/checkout@v7

      - name: ruff lint
        run: ruff check .

      - name: ruff format
        if: ${{ !cancelled() }}
        run: ruff format . --check

      - name: pycodestyle
        if: ${{ !cancelled() }}
        run: pycodestyle --max-line-length=79 --max-doc-length=72 --ignore=E203,W503 --exclude=Common-Components,build,.venv,sim_build,__pycache__ .

      - name: pydocstyle
        if: ${{ !cancelled() }}
        run: pydocstyle --convention=pep257 --match-dir='^(?!(Common-Components|build|\.venv|sim_build|__pycache__)).*' .

      - name: complexipy
        if: ${{ !cancelled() }}
        run: complexipy .

      - name: semgrep
        if: ${{ !cancelled() }}
        run: semgrep scan --config p/python --error .
