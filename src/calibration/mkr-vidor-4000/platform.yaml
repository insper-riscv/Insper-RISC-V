# Plataforma de calibração da família cyclone-10-lp na Arduino MKR Vidor 4000 (10CL016YU256C8G). Esquema: docs/pt-br/boards/formato.md.
# Só o `quartus_map` lê este arquivo: a lista de perfis (`boards/calibration/profiles/cyclone-10-lp.yaml`) troca o perfil, os extras e as caches, e o
# harness do Tools (`riscv-tools calibrate run`) regera o pacote do mapa de memória e o projeto da placa a cada perfil.
# O topo é o da DE0-CV: BOOT_MEMORY, FLASH emulada de 12 KiB com carregador e JTAG, console JTAG UART, display e a RAM emulada em blocos (o controlador de SDRAM do Memory tem endereço de linha de 13 bits e a SDRAM da placa tem 12).
platform: mkr-vidor-4000
board: auto
boards: [mkr-vidor-4000]
# O componente do paths.yaml cujo fecho de `requires` é a lista de fontes do projeto gerado.
top: Insper-RISC-V/cal_mkr_vidor_4000_board
core:
  type: 32
  base: I
  extensions:
    - M
    - Zicclsm
    - Zicntr
    - Zihpm
    - Zifencei
    - Zimop
    - Zicond
    - Zihintntl
    - Zihintpause
    - Interrupts
    - Sscofpmf
profiles: ../../../Core/profiles/matrix.yaml
memory:
  boot:
    base: 0x00000000
    size: 4K
  instructions:
    - type: emulated
      base: 0x00001000
      size: 12K
      on_bus: true
      latency: {first: 24, next: 4}
      sector_bytes: 4096
      cache:
        size_bits: 32768
  data:
    - type: emulated
      base: 0x40000000
      size: 8K
      on_bus: true
      cache:
        size_bits: 32768

reserved:
  stdout:   {base: 0x40001BE0, size: 1K+8}
  tohost:   {base: 0x40001FE8, size: 8}
  fromhost: {base: 0x40001FF0, size: 8}
boot:
  entry: 0x00001000
  wait_restart: 0x00000100
clocks:
  core: {mhz: 50, phase_ps: 8250}
  mem:  {mhz: 100}
console: jtag
io: {}
generate:
  vhdl: {path: src/calibration/mkr-vidor-4000/mkr_vidor_4000_map_pkg.vhd, package: mkr_vidor_4000_map_pkg, rom: FLASH, ram: RAM}
  # The constants of the platform for the whole design (ISA, address width, memory map in bytes, peripherals):
  # this file takes the place of the default config_pkg of the Common-Components in the source lists.
  config_pkg: {path: src/calibration/mkr-vidor-4000/config_pkg.vhd}
# An access to the padding of a peripheral window (what its registers do not take) is an access fault when true;
# the map package of the platform carries it as STRICT_PERIPH.
strict_periph: true

peripherals:
  FLASH_CTRL:
    base: 0xB0000000
    size: 32
  UART:
    base: 0xC0000000
    size: 1K
  DISPLAY:
    base: 0xD0000000
    size: 1K
  CLINT:
    base: 0xE0000000
    size: 64K
  PLIC:
    base: 0xF0000000
    size: 4M

interrupts:
  clock_hz: 50000000
  mtime_hz: 1000000
  plic: {priority_bits: 3}
  sources:
    - {name: UART_JTAG, id: 2}
    - {name: FLASH,     id: 6}
