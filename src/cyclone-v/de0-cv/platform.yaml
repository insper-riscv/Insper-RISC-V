# The memory map of the SDRAM platform with the FLASH behind the caches: the BOOT_ROM inside the core, the
# FLASH (1 MB at 0x20000000) and the board's 64 MB SDRAM (the RAM) reached through the instruction and data
# caches: the source of truth `riscv-tools check-memory-map` checks every hand-written copy against.
#
#   uv run riscv-tools --root . check-memory-map --platform src/cyclone-v/de0-cv/platform.yaml
#
# Paths in `checks` are relative to the root of this repository; `Core` and
# `Memory` are the submodules of this repository.
# The copies that the project running the tests owns (its config.yaml, the
# generated rv32_test.h) are not here: its memory section is this platform's
# config.yaml, extended, and the header is generated from it.
platform: sdram-flash
profile: rv32im

regions:
  - {name: BOOT_ROM, base: 0x00000000, size: 2K,   kind: rom, exec: true}
  - {name: FLASH,    base: 0x20000000, size: 1M,   kind: rom, exec: true}
  - {name: RAM,      base: 0x40000000, size: 64M,  kind: ram}   # the SDRAM

# Words at the top of RAM: the contract between the boot ROM, the program and
# the host (platform/boot_rom.S clears them at every reset).
reserved:
  stdout:   {base: 0x43FFFBE0, size: 1K+8}
  tohost:   {base: 0x43FFFFE8, size: 8}
  fromhost: {base: 0x43FFFFF0, size: 8}

boot:
  entry: 0x20000000
  wait_restart: 0x00000100

peripherals: []

# The files written from this map by `riscv-tools generate-memory-map` (`make generate`): the linker
# flags of the test programs and the linker script of the boot ROM. `make memory-map` checks they are up to date.
generate:
  specs: {path: src/cyclone-v/de0-cv/runtime/rv32im-fpga.specs, rom: FLASH, ram: RAM, ram_limit: stdout}
  boot_ld: {path: src/cyclone-v/de0-cv/runtime/boot_rom.ld}

checks:
  # --- config.yaml ---------------------------------------------------------
  - {name: config boot_rom_base, file: src/simulation/internal-mem/config.yaml, yaml: memory.boot_rom_base, expect: BOOT_ROM.base}
  - {name: config boot_rom_words, file: src/simulation/internal-mem/config.yaml, yaml: memory.boot_rom_words, expect: BOOT_ROM.words}
  - {name: config rom_base, file: src/cyclone-v/de0-cv/config.yaml, yaml: memory.rom_base, expect: FLASH.base}
  - {name: config rom_words, file: src/cyclone-v/de0-cv/config.yaml, yaml: memory.rom_words, expect: FLASH.words}
  - {name: config rom_origin, file: src/cyclone-v/de0-cv/config.yaml, yaml: memory.rom_origin, expect: FLASH.base}
  - {name: config ram_base, file: src/cyclone-v/de0-cv/config.yaml, yaml: memory.ram_base, expect: RAM.base}
  - {name: config ram_words, file: src/cyclone-v/de0-cv/config.yaml, yaml: memory.ram_words, expect: RAM.words}
  - {name: config tohost_addr, file: src/cyclone-v/de0-cv/config.yaml, yaml: memory.tohost_addr, expect: tohost.base}
  - {name: config fromhost_addr, file: src/cyclone-v/de0-cv/config.yaml, yaml: memory.fromhost_addr, expect: fromhost.base}
  - {name: config sim boot_rom_addr_width, file: src/simulation/internal-mem/config.yaml, yaml: sim.parameters.boot_rom_addr_width, expect: clog2(BOOT_ROM.words)}

  # --- boot ROM (boot_rom.S; its linker script is generated) --------------
  - {name: boot_rom.S RAM end, file: src/cyclone-v/de0-cv/runtime/boot_rom.S, pattern: '^\s*li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*$', expect: RAM.end}
  - {name: boot_rom.S stdout header, file: src/cyclone-v/de0-cv/runtime/boot_rom.S, pattern: 'li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*// stdout header', expect: stdout.base}
  - {name: boot_rom.S FLASH_BASE, file: src/cyclone-v/de0-cv/runtime/boot_rom.S, pattern: 'li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*// FLASH_BASE', expect: boot.entry}
  - {name: boot_rom.S fromhost offset, file: src/cyclone-v/de0-cv/runtime/boot_rom.S, pattern: '(-\d+)\(t0\)\s*// fromhost', expect: fromhost.base - RAM.end}
  - {name: boot_rom.S tohost offset, file: src/cyclone-v/de0-cv/runtime/boot_rom.S, pattern: '(-\d+)\(t0\)\s*// tohost', expect: tohost.base - RAM.end}

  # --- runtime and Spike stand-in (shared with the sdram platform) ----------
  - {name: _exit.c tohost, file: src/cyclone-v/de0-cv/runtime/_exit.c, pattern: '\(volatile unsigned int \*\)(0x[0-9A-Fa-f]+)u', expect: tohost.base}
  - {name: stdio.c STDOUT_BASE, file: src/cyclone-v/de0-cv/runtime/stdio.c, pattern: '#define STDOUT_BASE (0x[0-9A-Fa-f]+)u', expect: stdout.base}
  - {name: spike_exit.S tohost, file: src/cyclone-v/de0-cv/runtime/spike_exit.S, pattern: '\.equ tohost, (\S+)', expect: tohost.base}
  - {name: spike_exit.S fromhost, file: src/cyclone-v/de0-cv/runtime/spike_exit.S, pattern: '\.equ fromhost, (\S+)', expect: fromhost.base}

  # --- VHDL of the core ----------------------------------------------------
  - {name: core boot_rom_bits, file: src/cyclone-v/de0-cv/de0-cv_top.vhd, pattern: 'boot_rom_bits\s*=>\s*(\d+)', expect: clog2(BOOT_ROM.size)}
  - {name: core ext_base_kib, file: src/cyclone-v/de0-cv/de0-cv_top.vhd, pattern: 'ext_base_kib\s*=>\s*(\d+)', expect: FLASH.base / 1024}

  # --- the SDRAM is the RAM: the core decodes it as its external data region -------------
  - {name: core ram_base_kib, file: src/cyclone-v/de0-cv/de0-cv_top.vhd, pattern: 'ram_base_kib\s*=>\s*(\d+)', expect: RAM.base / 1024}

  # --- the testbench and the test programs' header (only in RV32IM's tree) -----------------
  - {name: testbench TOHOST_ADDR, file: src/cyclone-v/de0-cv/testbench/test_c_program.py, pattern: '^TOHOST_ADDR = (0x[0-9A-Fa-f]+)', expect: tohost.base}
  - {name: Tests header RV32_RAM_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_BASE\s+(0x[0-9A-Fa-f]+)', expect: RAM.base}
  - {name: Tests header RV32_RAM_END, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_END\s+(0x[0-9A-Fa-f]+)', expect: RAM.end}
  - {name: Tests header RV32_STDOUT_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_STDOUT_BASE\s+(0x[0-9A-Fa-f]+)', expect: stdout.base}
