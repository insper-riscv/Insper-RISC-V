# The de0-cv platform: the DE0-CV board (Cyclone V) with the FLASH as a chip behind the caches (the
# design of a real SoC). The core holds only the BOOT_MEMORY; the FLASH (254 KiB right after the BOOT_MEMORY) and the SDRAM
# (64 MB at 0x40000000, 143 MHz) are reached through an instruction cache and a write-through data
# cache, whose line requests a region router sends to the FLASH chip model (through its arbiter) or to
# the SDRAM controller. The SDRAM is THE RAM: it holds .data, .bss, the heap, the stack and the words
# the host shares with the program (tohost, fromhost, stdout); there is no RAM inside the FPGA. The host
# reads and writes the SDRAM through the debug port (JTAG). Only what differs from internal-mem is
# written here.
extends: ../../simulation/internal-mem/config.yaml

# The tests are linked for bank A (from the end of its header page) and packed as its image: the boot memory
# only runs a bank whose header (magic, size and CRC-32s) is valid.
toolchain:
  specs: src/cyclone-v/de0-cv/runtime/rv32im-fpga-bank-a.specs

flash_image: {bank: A, version: 1}

# The addresses and the sizes come from the map of the platform (platform.yaml), as in internal-mem: the SDRAM is
# the RAM and the FLASH sits right after the BOOT_MEMORY.
memory_map: platform.yaml

paths:
  sources:
    - src/cyclone-v/de0-cv/runtime/_exit.c
    - src/cyclone-v/de0-cv/runtime/stdio.c
  boot_memory: src/cyclone-v/de0-cv/runtime/boot_memory.S
  boot_memory_linker_script: src/cyclone-v/de0-cv/runtime/boot_memory.ld

emulator:
  sources:
    - src/cyclone-v/de0-cv/runtime/spike_exit.S

sim:
  toplevel: rv32im_sdram_flash_sim_test
  # Lista gerada por `make generate-sources` (scripts/generate_sources.py) a partir do provides; não edite à mão.
