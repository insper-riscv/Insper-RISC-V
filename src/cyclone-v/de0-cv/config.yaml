# The de0-cv platform: the DE0-CV board (Cyclone V) with the FLASH as a chip behind the caches (the
# design of a real SoC). The core holds only the BOOT_ROM; the FLASH (1 MB at 0x20000000) and the SDRAM
# (64 MB at 0x40000000, 143 MHz) are reached through an instruction cache and a write-through data
# cache, whose line requests a region router sends to the FLASH chip model (through its arbiter) or to
# the SDRAM controller. The SDRAM is THE RAM: it holds .data, .bss, the heap, the stack and the words
# the host shares with the program (tohost, fromhost, stdout); there is no RAM inside the FPGA. The host
# reads and writes the SDRAM through the debug port (JTAG). Only what differs from internal-mem is
# written here.
extends: ../../simulation/internal-mem/config.yaml

toolchain:
  specs: src/cyclone-v/de0-cv/runtime/rv32im-fpga.specs

memory:
  ram_base: 0x40000000
  ram_words: 16777216          # 64 MB
  tohost_addr: 0x43FFFFE8
  fromhost_addr: 0x43FFFFF0
  rom_base: 0x20000000
  rom_words: 262144            # 1 MB
  # the first word of the program image sits at the base of the FLASH: no leading padding
  rom_origin: 0x20000000

paths:
  sources:
    - src/cyclone-v/de0-cv/runtime/_exit.c
    - src/cyclone-v/de0-cv/runtime/stdio.c
  boot_rom: src/cyclone-v/de0-cv/runtime/boot_rom.S
  boot_rom_linker_script: src/cyclone-v/de0-cv/runtime/boot_rom.ld

emulator:
  sources:
    - src/cyclone-v/de0-cv/runtime/spike_exit.S

sim:
  toplevel: rv32im_sdram_flash_sim_test
  vhdl_sources:
    - Core/src/shared/pipeline_types.vhd
    - Core/src/shared/byte_mask_consts.vhd
    - Core/src/shared/opcode_consts.vhd
    - Core/src/shared/funct3_consts.vhd
    - Core/src/shared/funct7_consts.vhd
    - Core/src/shared/alu_consts.vhd
    - Core/src/shared/ext_imm_consts.vhd
    - Core/src/shared/ext_ram_consts.vhd
    - Core/src/shared/wb_sel_consts.vhd
    - Core/src/shared/pc_src_consts.vhd
    - Core/src/shared/mem_map_consts.vhd
    - Core/src/shared/fwd_consts.vhd
    - Core/src/shared/word_consts.vhd
    - Core/src/M/muldiv_consts.vhd
    - Core/src/Zicsr/csr_value_consts.vhd
    - Core/src/Zicsr/trap_consts.vhd
    - Common-Components/src/generic_register.vhd
    - Common-Components/src/adder.vhd
    - Common-Components/src/mux_2x1.vhd
    - Common-Components/src/mux_4x1.vhd
    - Common-Components/src/flip_flop.vhd
    - Common-Components/src/utils_pkg.vhd
    - Core/src/I/alu.vhd
    - Common-Components/src/onehot_decoder.vhd
    - Common-Components/src/mux_tree.vhd
    - Core/src/shared/reg_file.vhd
    - Core/src/I/extender_imm.vhd
    - Core/src/I/extender_ram.vhd
    - Core/src/I/store_manager.vhd
    - Core/src/Zicclsm/misaligned_unit.vhd
    - Core/src/shared/control_unit.vhd
    - Core/src/shared/bubble_mux.vhd
    - Core/src/shared/forwarding_match.vhd
    - Core/src/shared/forwarding_unit.vhd
    - Core/src/shared/hazard_detection_unit.vhd
    - Core/src/M/m_decode.vhd
    - Core/src/M/booth_multiplier_rv32.vhd
    - Core/src/M/non_restoring_divider_rv32.vhd
    - Core/src/M/muldiv_fusion.vhd
    - Core/src/M/multdiv.vhd
    - Core/src/Zicsr/csr_decode.vhd
    - Core/src/Zicsr/csr_addr_consts.vhd
    - Core/src/Zicsr/csr_event_consts.vhd
    - Core/src/Zicntr/counter64.vhd
    - Core/src/Zicntr/tick_divider.vhd
    - Core/src/Zicsr/csr_file.vhd
    - Core/src/Zicsr/trap_unit.vhd
    - Core/src/Zifencei/fencei_unit.vhd
    - Core/src/shared/pc_fetch.vhd
    - Core/src/shared/reg_if_id.vhd
    - Core/src/shared/reg_id_ex.vhd
    - Core/src/shared/reg_ex_mem.vhd
    - Core/src/shared/reg_mem_wb.vhd
    - Core/src/core/stage_if.vhd
    - Core/src/core/stage_id.vhd
    - Core/src/core/stage_ex.vhd
    - Core/src/core/stage_mem.vhd
    - Core/src/core/stage_wb.vhd
    - Core/src/core/core.vhd
    - Memory/src/ram/soc/ram_simulation.vhd
    - Memory/src/rom/soc/rom_simulation.vhd
    - Memory/src/ram/soc/sdram_pkg.vhd
    - Common-Components/src/synchronizer.vhd
    - Memory/src/ram/soc/sdram_ctrl.vhd
    - Memory/src/ram/soc/sdram_cpu_bridge.vhd
    - Memory/src/ram/soc/sdram_arbiter.vhd
    - Memory/src/cache/soc/icache.vhd
    - Memory/src/cache/soc/dcache.vhd
    - Memory/src/cache/soc/flash_chip.vhd
    - Memory/src/cache/soc/flash_arbiter.vhd
    - Memory/src/cache/soc/mem_region_router.vhd
    - Memory/src/ram/soc/sdram_dbg_master.vhd
    - Memory/src/ram/soc/sdram_jtag_core.vhd
    - Memory/src/ram/soc/sim/sdram_model.vhd
    - Memory/src/ram/soc/sim/sdram_system.vhd
    - Peripherals/src/UART/jtag/jtag_uart.vhd
    - Peripherals/src/display/soc/hex_to_seg7.vhd
    - Peripherals/src/display/soc/seg_display.vhd
    - src/interconnect/ext_interconnect.vhd
    - src/simulation/internal-mem/rtl/clk_gen_3way.vhd
    - src/cyclone-v/de0-cv/de0-cv_sim_top.vhd
  # FENCE.I invalidates the instruction cache of this platform (the generic exists in its top only)
  parameters:
    HAS_ZIFENCEI: true
    HAS_ZIHPM: true
    # the storage model of the FLASH is 256 KB (65536 words, 16 bits): the chip window is 1 MB, the model
    # array is smaller because a larger one does not run in GHDL; the programs are far smaller
    rom_addr_width: "16"
  test_module: testbench.test_c_program
  python_path:
    - src/cyclone-v/de0-cv
  # The testbench also drives the SDRAM clock (7 ns, no relation to the core clock), and the SDRAM's
  # power-up wait (200 us) comes before the first access: ticks of CLK are counted for the timeout,
  # so it is longer than internal-mem's.
  env:
    SIM_EXTRA_CLOCKS: "CLK_MEM:7"
    SIM_SAMPLE_CLOCK: pll_clk_idexmem
    SIM_TIMEOUT_CYCLES: "2000000"

quartus:
  project_dir: src/cyclone-v/de0-cv
  project_name: de0-cv
  sof_file: output_files/de0-cv.sof
  rom_mif_target: flash_init.mif
  boot_rom_mif_target: boot_rom_init.mif
  # the host reaches the RAM (the SDRAM) through the debug port, not the memory editor
  ram_backend: sdram_debug
  # The memory editor sees BOOT_ROM (0) and the FLASH storage (1); the SDRAM is reached through the debug port.
  rom_mem_instances: [1]
