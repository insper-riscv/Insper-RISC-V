  test_module: testbench.test_c_program
  python_path:
    - src/cyclone-v/de0-cv
  # The testbench also drives the SDRAM clock (7 ns, no relation to the core clock), and the SDRAM's
  # power-up wait (200 us) comes before the first access: ticks of CLK are counted for the timeout,
  # so it is longer than internal-mem's. The boot memory also checks the CRC-32 of the image before the
  # jump, about 850 ticks of CLK for each word of the program (a program of 8 KiB takes 1.7 million).
  env:
    SIM_EXTRA_CLOCKS: "CLK_MEM:7"
    SIM_SAMPLE_CLOCK: pll_clk_idexmem
    SIM_TIMEOUT_CYCLES: "12000000"
    UART_START_ON_ACCESS: "1"
    UART_SLOT: "4"

quartus:
  project_dir: src/cyclone-v/de0-cv
  project_name: de0-cv
  sof_file: output_files/de0-cv.sof
  rom_mif_target: flash_init.mif
  boot_memory_mif_target: boot_memory_init.mif
  # the host reaches the RAM (the SDRAM) through the debug port, not the memory editor
  ram_backend: sdram_debug
  # The memory editor sees only the FLASH storage (0), the one IP that declares ENABLE_RUNTIME_MOD; the BOOT_MEMORY is
  # written once by the full compile and the SDRAM is reached through the debug port.
  rom_mem_instances: [0]
  # The de0-cv top has no JTAG loader (internal-mem has): the FLASH store is rewritten through the memory editor, so the
  # method inherited from internal-mem (jtag_loader) must be overridden.
  rom_write_method: mem_edit
