# Platform doom, created by `riscv-tools new-project` from de0-cv.
# Edit this file and run `riscv-tools generate-memory-map` again.
# The memory map of the DOOM platform in the style of the de0-cv: the BOOT_MEMORY inside the core and the 64 MB SDRAM
# of the board split in two windows of the same controller, the FLASH (the instructions and constants of the DOOM,
# 4 MiB at the top of the chip, read only for the core) and the RAM (the data, 60 MiB from the start of the chip), both
# behind the instruction and the data caches. There is no emulated FLASH, no FLASH controller and no loader: the host
# writes the image into the FLASH window through the debug port of the SDRAM (`riscv-tools load-flash`) and releases the core.
#
#   uv run riscv-tools --root . check-memory-map --platform src/cyclone-v/doom/platform.yaml
#
# Paths in `checks` are relative to the root of this repository; `Core` and
# `Memory` are the submodules of this repository.
# The copies that the project running the tests owns (its config.yaml, the
# generated rv32_test.h) are not here: its memory section is this platform's
# config.yaml, extended, and the header is generated from it.
platform: doom
# The board of the platform: `auto` asks for the identification by the JTAG; `boards` lists the boards it is built on.
board: auto
boards: [de0-cv]
# The component of paths.yaml whose closure of `requires` is the source list of the generated project.
top: Insper-RISC-V/doom_board
# The core of the platform: the width of the ISA, its base (I: 32 registers, E: 16) and the extensions it implements.
# `--profile NAME` of riscv-tools replaces them for one run (a matrix of tests); `profiles` is the specification.
core:
  type: 32
  base: I
  extensions:
    - M
    - Zicclsm
    - Zicntr
    - Zihpm
    - Zifencei
    - Zimop
    - Zicond
    - Zihintntl
    - Zihintpause
    - Interrupts
    - Sscofpmf
    - AccessFaults
profiles: ../../../Core/profiles/matrix.yaml

# The memory model: the BOOT_MEMORY inside the core, the FLASH (the instructions) and the RAM (the data), the last two in the
# one SDRAM chip of the board behind the instruction cache (262144 bits, 32 KiB) and the data cache (262144 bits, 32 KiB, with a
# write buffer of four words and an internal memory of 32 KiB, `scratch_kib` at `scratch_base`, inside the RAM, that the data cache
# serves in the time of a hit and that never reaches the SDRAM). The RAM keeps the chip addresses it always had (the WAD at
# 0x40100000 is chip byte 1 MiB); the FLASH is the 4 MiB at the top of the chip, from the chip byte 60 MiB (`offset`).
# The DOOM image (about 600 KiB of code, constants and initial data) is linked from 0x1000 and the core only reads it.
memory:
  boot:
    base: 0x00000000
    size: 4K
  instructions:
    - type: sdram
      base: 0x00001000
      size: 0x3FF000
      offset: 0x3C01000
      on_bus: true
      cache:
        size_bits: 262144
  data:
    - type: sdram
      base: 0x40000000
      size: 60M
      offset: 0
      on_bus: true
      cache:
        size_bits: 262144
        write_buffer: 4
        scratch_kib: 32
        scratch_base: 0x43BE8000

# Words at the top of RAM: the contract between the boot memory, the program and the host.
reserved:
  stdout:   {base: 0x43BFFBE0, size: 1K+8}
  tohost:   {base: 0x43BFFFE8, size: 8}
  fromhost: {base: 0x43BFFFF0, size: 8}

boot:
  entry: 0x00001000
  wait_restart: 0x00000100

# An access to the padding of a peripheral slot (what its registers do not take) is an access fault when true;
# the config_pkg carries it as STRICT_PERIPH.
strict_periph: true

# The peripheral windows of the external interconnect (base and size of the registers of each): the JTAG UART and the
# seven-segment display of the board top, the CLINT (a 64 KiB window: msip, mtimecmp and mtime) and the PLIC (a 4 MiB
# window), the controller of the external interrupt lines, whose output is the MEIP of the core.
peripherals:
  UART:
    base: 0xC0000000
    size: 1K
  DISPLAY:
    base: 0xD0000000
    size: 1K
  CLINT:
    base: 0xE0000000
    size: 64K
  PLIC:
    base: 0xF0000000
    size: 4M
  # The indexed VGA video (kind: video, 256 KiB window: registers in words 0 to 4, the 256-entry palette from word 256
  # and the write-only framebuffer in the upper half) and the PS/2 keyboard on the first PS/2 channel of the board
  # (PS2_CLK, PS2_DAT), whose interrupt takes the first free line of the PLIC (5). A mouse on the second channel (the
  # Y cable: PS2_CLK2, PS2_DAT2) is one more entry, `MOUSE: {kind: ps2, device: mouse, base: 0x80007100}`.
  VIDEO:
    kind: video
    base: 0x80100000
  KBD:
    kind: ps2
    device: keyboard
    base: 0x80007000
  # The microSD socket of the board in the native 4-bit mode (SD_CLK, SD_CMD, SD_DATA[3:0]): the DOOM loads its WADs
  # from the card (port/doom_sd.c), polling (its PLIC line, the next free one, is assigned by the map but the IRQ bits of CONTROL stay off). The clock of the controller is `clocks.core`,
  # so SD_CLK is 100 MHz / (2 * (DIVIDER + 1)): 399 kHz after the reset and 25 MHz with DIVIDER = 1.
  SD:
    kind: sd_native
    base: 0x80008000

# The machine interrupts: MTIP and MSIP come from the CLINT, MEIP from the PLIC, all in the clock domain of the core
# (100 MHz here), so no synchronizer is needed. The mtime of the CLINT counts at mtime_hz (100 cycles per tick) and is
# mirrored by the CSR time of Zicntr, which the core serves (o_mtime of the CLINT into i_mtime of the core).
interrupts:
  # `clock_hz` is left out: it is `clocks.core` (100 MHz) taken as is, a whole number of cycles per tick (100), so the
  # mtime counts exactly at mtime_hz.
  mtime_hz: 1000000
  # The PLIC: three-bit priorities, and the line wired in this platform: the JTAG UART (board and simulation).
  plic: {priority_bits: 3}
  sources:
    - {name: UART_JTAG, id: 2}

# The clocks of the PLL, the single source of the generated PLL (`riscv-tools board generate`) and of the periods the
# generated files convert with. `core` and `fetch` are the same clock (100 MHz, phase 0), so they share one PLL output:
# the instruction memories (the BOOT_MEMORY and the instruction cache) read, on the edge of the core clock, the address
# the PC will have in the next cycle (`early_fetch_addr` of the SoC, set by the generator when `fetch` equals `core`),
# so the loop of the core through the instruction cache is made of whole cycles and the timing analysis is the real one,
# with no dependence on the phase of a clock ahead. The target of a taken branch, a jump or a trap is fetched one cycle
# later. `mem` is the clock of the SDRAM controller, on its own PLL output (125 MHz, 8000 ps, its pins have the same
# 8 ns); it must not be merged with `core`. `interrupts.clock_hz` is `clocks.core`.
clocks:
  core:  {mhz: 100, phase_ps: 0}
  fetch: {mhz: 100, phase_ps: 0}
  mem:   {mhz: 125}

# The console is the JTAG UART (Virtual JTAG); the roles of inputs and outputs the platform wires.
console: jtag
# The switches and the keys are not declared: a role of the SoC needs its window in `peripherals`, and this platform has none.
io:
  leds:     {count: 10, need: required}
  display:  {count: 6,  need: optional}
  # The DOOM renders 320x200 with an 8-bit index and a palette of 256 colors (3 x channel_bits each, 12 bits on the
  # DE0-CV). The default mode of the board (640x480 at 60 Hz) shows it doubled in x (`scale`, the largest that fits) and
  # magnified by 12/5 in y (`scale_y`): 200 x 12/5 = 480 lines, the whole 4:3 screen with no black bands, each source
  # line repeated 3, 2, 3, 2, 2 times (the pixel of the DOOM is 1.2 times taller than wide).
  video:
    pixel_format: indexed
    fb_width: 320
    fb_height: 200
    scale_y: 12/5

# The files written from this map by `riscv-tools generate-memory-map` (`make generate`): the linker
# flags of the test programs and the linker script of the boot memory. `make memory-map` checks they are up to date.
generate:
  specs: {path: src/cyclone-v/doom/runtime/rv32im-fpga.specs, rom: FLASH, ram: RAM, ram_limit: stdout}
  boot_ld: {path: src/cyclone-v/doom/runtime/boot_memory.ld}
  boot_config_h: {path: src/cyclone-v/doom/runtime/boot_config.h}
  runtime: {path: src/cyclone-v/doom/runtime/memory_map.h, ram: RAM}
  vhdl:
    path: src/cyclone-v/doom/doom_map_pkg.vhd
    package: doom_map_pkg
    rom: FLASH
    ram: RAM
  # The constants of the platform for the whole design (ISA, address width, memory map in bytes, peripherals):
  # this file takes the place of the default config_pkg of the Common-Components in the source lists.
  config_pkg: {path: src/cyclone-v/doom/config_pkg.vhd}

# What the config.yaml of the platform reads from this map (`memory_map: platform.yaml`). The RAM is the SDRAM, so
# only the BOOT_MEMORY is a simulation array with an address width.
config:
  rom: FLASH
  ram: RAM
  addr_widths: [boot_memory]

checks:
  # --- config.yaml ---------------------------------------------------------

  # --- boot memory (boot_memory.S; its linker script is generated) --------------

  # --- runtime and Spike stand-in (shared with the sdram platform) ----------

  # --- VHDL of the core ----------------------------------------------------

  # --- the SDRAM is the RAM: the core decodes it as its external data region -------------

  # --- the testbench and the test programs' header (only in RV32IM's tree) -----------------
  - {name: Tests header RV32_RAM_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_BASE\s+(0x[0-9A-Fa-f]+)', expect: RAM.base}
  - {name: Tests header RV32_RAM_END, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_END\s+(0x[0-9A-Fa-f]+)', expect: RAM.end}
  - {name: Tests header RV32_STDOUT_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_STDOUT_BASE\s+(0x[0-9A-Fa-f]+)', expect: stdout.base}
  - {name: Tests header RV32_UART_BASE, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_UART_BASE\s+(0x[0-9A-Fa-f]+)', expect: UART.base}
  - {name: Tests header RV32_TICK_CYCLES, file: ../Tests/tools/riscv_build/include-sdram/rv32_platform.h, optional: true, pattern: '#define RV32_TICK_CYCLES\s+(\d+)', expect: INTERRUPTS.tick_cycles}
