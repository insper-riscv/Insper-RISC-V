# The memory map of the fpga-integrated platform: DE0-CV platform, BOOT_MEMORY, FLASH and RAM inside the FPGA; switches, buttons and displays.
#
#   riscv-tools --root . generate-memory-map --platform src/cyclone-v/fpga-integrated/platform.yaml
#
# The source of truth of the generics of modular_sim_top and of the linker script of the programs. The
# `memory` section is the combination of this platform; a test replaces it for one run (`--memory`).
platform: fpga-integrated
core:
  type: 32
  base: I
  extensions:
    - M
    - Zicclsm
    - Zicntr
    - Zihpm
    - Zimop
    - Zicond
profiles: ../../../Core/profiles/matrix.yaml

memory:
  boot:
    base: 0x00000000
    size: 4K
  instructions:
    - type: onchip
      base: 0x00001000
      size: 28K
      on_bus: false
  data:
    - type: onchip
      base: 0x00008000
      size: 160K
      on_bus: false

reserved:
  stdout:   {base: 0x0002FBE0, size: 1K+8}
  tohost:   {base: 0x0002FFE8, size: 8}
  fromhost: {base: 0x0002FFF0, size: 8}

boot:
  entry: 0x00001000
  wait_restart: 0x00000100

# An access to the padding of a peripheral window (what its registers do not take) is an access fault when true;
# the map package of the platform carries it as STRICT_PERIPH.
strict_periph: true

# The peripheral windows (the base is where the program sees the peripheral; the window is the smallest power of
# two, of at least 16 bytes, that holds the registers).
peripherals:
  SWITCHES:   # the ten slide switches SW (GPIO)
    base: 0x90000000
    size: 64
  KEYS:   # the four push buttons KEY (GPIO)
    base: 0xA0000000
    size: 64
  DISPLAY:   # the six seven-segment displays HEX0 to HEX5 (display)
    base: 0xD0000000
    size: 1K

generate:
  specs: {path: src/cyclone-v/fpga-integrated/runtime/rv32im-fpga.specs, rom: FLASH, ram: RAM, ram_limit: stdout}
  boot_ld: {path: src/cyclone-v/fpga-integrated/runtime/boot_memory.ld}
  runtime: {path: src/cyclone-v/fpga-integrated/runtime/memory_map.h, ram: RAM}
  vhdl:
    path: src/cyclone-v/fpga-integrated/modular_map_pkg.vhd
    package: modular_map_pkg
    rom: FLASH
    ram: RAM
  # The constants of the platform for the whole design (ISA, address width, memory map in bytes, peripherals):
  # this file takes the place of the default config_pkg of the Common-Components in the source lists.
  config_pkg: {path: src/cyclone-v/fpga-integrated/config_pkg.vhd}

# What the config.yaml of the platform reads from this map (`memory_map: platform.yaml`).
config:
  rom: FLASH
  ram: RAM
  addr_widths: []

checks:
  - {name: Tests header RV32_RAM_BASE, file: ../Tests/tools/riscv_build/include-fpga-integrated/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_BASE\s+(0x[0-9A-Fa-f]+)', expect: RAM.base}
  - {name: Tests header RV32_RAM_END, file: ../Tests/tools/riscv_build/include-fpga-integrated/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_END\s+(0x[0-9A-Fa-f]+)', expect: RAM.end}
  - {name: Tests header RV32_STDOUT_BASE, file: ../Tests/tools/riscv_build/include-fpga-integrated/rv32_platform.h, optional: true, pattern: '#define RV32_STDOUT_BASE\s+(0x[0-9A-Fa-f]+)', expect: stdout.base}
  - {name: Tests header RV32_TOHOST, file: ../Tests/tools/riscv_build/include-fpga-integrated/rv32_platform.h, optional: true, pattern: '#define RV32_TOHOST\s+(0x[0-9A-Fa-f]+)', expect: tohost.base}
