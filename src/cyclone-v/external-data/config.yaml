# The external-data platform: the DE0-CV board (Cyclone V) with the ROM inside the core and the RAM outside it.
# The BOOT_MEMORY and the FLASH are inside the FPGA, the FLASH as one copy of a two-port memory that the host rewrites
# over JTAG while the core is stopped (the same FLASH and loader as internal-mem); the SDRAM (64 MB at 0x40000000,
# 143 MHz) is THE RAM and is reached through a write-through data cache. There is no instruction cache and no FLASH
# chip: the instruction fetch reads port A of the FLASH and the data port of the core reads port B. The host reads and
# writes the SDRAM through the debug port (JTAG). Only what differs from de0-cv is written here.
extends: ../de0-cv/config.yaml

toolchain:
  specs: src/cyclone-v/external-data/runtime/rv32im-fpga.specs

# The addresses and the sizes come from the map of the platform (platform.yaml): the SDRAM is the RAM and the FLASH sits
# right after the BOOT_MEMORY.
memory_map: platform.yaml

paths:
  sources:
    - src/cyclone-v/external-data/runtime/_exit.c
    - src/cyclone-v/external-data/runtime/stdio.c
  boot_memory: src/cyclone-v/external-data/runtime/boot_memory.S
  boot_memory_linker_script: src/cyclone-v/external-data/runtime/boot_memory.ld

emulator:
  sources:
    - src/cyclone-v/external-data/runtime/spike_exit.S

sim:
  toplevel: rv32im_external_data_sim_test
  # Lista gerada por `make generate-sources` (scripts/generate_sources.py) a partir do provides; não edite à mão.
