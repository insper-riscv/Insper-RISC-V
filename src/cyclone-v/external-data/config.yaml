  test_module: testbench.test_c_program
  # The cocotb testbench of the SDRAM platform drives this top too: the ports and the signals it reads are the same.
  python_path:
    - src/cyclone-v/de0-cv
  # The testbench also drives the SDRAM clock (7 ns, no relation to the core clock), and the SDRAM's
  # power-up wait (200 us) comes before the first access: ticks of CLK are counted for the timeout.
  env:
    SIM_EXTRA_CLOCKS: "CLK_MEM:10"
    SIM_SAMPLE_CLOCK: pll_clk_idexmem
    SIM_TIMEOUT_CYCLES: "2000000"

quartus:
  project_dir: src/cyclone-v/external-data
  project_name: external-data
  sof_file: output_files/external-data.sof
  # The path (relative to project_dir) the FLASH IP reads its initial contents from at synthesis time.
  rom_mif_target: init.mif
  boot_memory_mif_target: boot_memory_init.mif
  # The host reaches the RAM (the SDRAM) through the debug port, not the memory editor. The top gives the port the
  # Virtual JTAG instance 3 (the FLASH loader has the 0, the JTAG UART the 1 and the display the 2).
  ram_backend: sdram_debug
  sdram_debug_instance: 3
  # The FLASH is a single true dual-port copy that the JTAG loader of the Memory repository rewrites per test with the
  # core halted: it has no In-System Memory Content Editor instance, and neither has the BOOT_MEMORY.
  rom_write_method: jtag_loader
  rom_mem_instances: []
