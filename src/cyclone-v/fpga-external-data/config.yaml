# A configuração do pipeline de compilação e simulação da plataforma fpga-external-data (DE0-CV platform, FLASH inside the FPGA and the SDRAM behind the data cache; switches, buttons and displays.)
# O topo é o modular_sim_top; o mapa, a combinação de memórias e os genéricos HAS_* vêm do platform.yaml.
#
#   riscv-tools --profile PERFIL --config src/cyclone-v/fpga-external-data/config.yaml ...

toolchain:
  gcc: riscv32-unknown-elf-gcc
  objcopy: riscv32-unknown-elf-objcopy
  # O mapa e o crt0 são um arquivo de specs, gerado do platform.yaml.
  specs: src/cyclone-v/fpga-external-data/runtime/rv32im-fpga.specs

isa:
  base: i
  default_ext: ""
  canonical_order: "MAFDQLCBJTPVNH"

memory_map: platform.yaml

paths:
  # As partes do runtime próprias da plataforma, compiladas em todo programa.
  sources:
    - src/cyclone-v/fpga-external-data/runtime/_exit.c
    - src/cyclone-v/fpga-external-data/runtime/stdio.c
  # O carregador fixo, construído uma vez para a BOOT_MEMORY.
  boot_memory: src/cyclone-v/fpga-external-data/runtime/boot_memory.S
  boot_memory_linker_script: src/cyclone-v/fpga-external-data/runtime/boot_memory.ld

sim:
  toplevel: modular_sim_top
  # Lista gerada por `make generate-sources` (scripts/generate_sources.py) a partir do provides; não edite à mão.
  vhdl_sources:
    - Common-Components/src/utils_pkg.vhd
    - src/cyclone-v/fpga-external-data/config_pkg.vhd
    - src/cyclone-v/fpga-external-data/modular_map_pkg.vhd
