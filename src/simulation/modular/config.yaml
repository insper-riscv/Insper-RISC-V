    - Peripherals/src/display/soc/hex_to_seg7.vhd
    - Peripherals/src/display/soc/seg_display.vhd
    - Peripherals/src/UART/jtag/jtag_uart.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/uart2BusTop_pkg.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/baudGen.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/uartRx.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/uartTx.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/uartTop.vhd
    - Peripherals/src/UART/serial/uart_fifo.vhd
    - Peripherals/src/UART/serial/uart.vhd
    - src/simulation/modular/modular_sim_top.vhd
  test_module: testbench.test_c_program
  python_path:
    - src/simulation/modular
  env:
    # O tempo conta ciclos do núcleo (o clock da amostragem); com as memórias atrás de caches, a latência dos
    # chips alonga os programas.
    SIM_SAMPLE_CLOCK: pll_clk_idexmem
    SIM_TIMEOUT_CYCLES: "2000000"
  ghdl_std: "08"
  # As imagens: a BOOT_MEMORY é construída uma vez e a ROM vem do programa de cada teste. Os tamanhos das
  # memórias são os genéricos do topo, cujo padrão vem de modular_map_pkg.
  parameters:
    BOOT_MEMORY_FILE: "{boot_memory_hex_path}"
    ROM_FILE: "{hex_path}"

# O Spike executa a imagem de cada programa, que termina no rv32_wait_restart de spike_exit.S.
emulator:
  sources:
    - src/simulation/modular/runtime/spike_exit.S
  gcc_flags:
    - -DRV32_SPIKE
