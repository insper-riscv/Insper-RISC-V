# A configuração do pipeline de compilação e simulação da plataforma modular, que roda os programas dos
# repositórios de teste (Tests) em qualquer combinação de memórias e caches:
#
#   riscv-tools --profile PERFIL --memory rom=ext,ram=int,icache=on,dcache=off --config src/simulation/modular/config.yaml ...
#
# Os endereços e os tamanhos vêm do mapa da plataforma (platform.yaml), a escolha das memórias e das caches vem
# da seção `memory` dele (ou de `--memory`), e o topo recebe tudo como genéricos. Nada do mapa é escrito aqui.

toolchain:
  gcc: riscv32-unknown-elf-gcc
  objcopy: riscv32-unknown-elf-objcopy
  # O mapa e o crt0 são um arquivo de specs, gerado do platform.yaml.
  specs: src/simulation/modular/runtime/rv32im-fpga.specs

isa:
  base: i
  default_ext: ""
  canonical_order: "MAFDQLCBJTPVNH"

memory_map: platform.yaml

paths:
  # As partes do runtime próprias da plataforma, compiladas em todo programa.
  sources:
    - src/simulation/modular/runtime/_exit.c
    - src/simulation/modular/runtime/stdio.c
  # O carregador fixo, construído uma vez para a BOOT_MEMORY.
  boot_memory: src/simulation/modular/runtime/boot_memory.S
  boot_memory_linker_script: src/simulation/modular/runtime/boot_memory.ld

sim:
  toplevel: modular_sim_top
  # Lista gerada por `make generate-sources` (scripts/generate_sources.py) a partir do provides; não edite à mão.
  vhdl_sources:
    - src/simulation/modular/modular_map_pkg.vhd
    - src/interconnect/ext_interconnect.vhd
    - src/simulation/internal-mem/rtl/clk_gen_3way.vhd
