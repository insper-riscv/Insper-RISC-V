    - Core/src/shared/alu_consts.vhd
    - Core/src/shared/ext_imm_consts.vhd
    - Core/src/shared/ext_ram_consts.vhd
    - Core/src/shared/wb_sel_consts.vhd
    - Core/src/shared/pc_src_consts.vhd
