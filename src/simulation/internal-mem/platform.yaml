# The memory map of the platform on the board (Cyclone V 5CEBA4F23, memories
# inside the FPGA): the source of truth `riscv-tools check-memory-map` checks
# every hand-written copy against.
#
#   uv run riscv-tools --root . check-memory-map --platform src/simulation/internal-mem/platform.yaml
#
# Paths in `checks` are relative to the root of this repository; `Core` and
# `Memory` are the submodules of this repository.
# The copies that the project running the tests owns (its config.yaml, the
# generated rv32_test.h) are not here: its memory section is this platform's
# config.yaml, extended, and the header is generated from it.
platform: internal-mem
profile: rv32im

regions:
  - {name: BOOT_ROM, base: 0x00000000, size: 2K,   kind: rom, exec: true}
  - {name: FLASH,    base: 0x00000800, size: 30K,  kind: rom, exec: true}
  - {name: RAM,      base: 0x00008000, size: 160K, kind: ram}

# Words at the top of RAM: the contract between the boot ROM, the program and
# the host (platform/boot_rom.S clears them at every reset).
reserved:
  stdout:   {base: 0x0002FBE0, size: 1K+8}
  tohost:   {base: 0x0002FFE8, size: 8}
  fromhost: {base: 0x0002FFF0, size: 8}

boot:
  entry: 0x00000800
  wait_restart: 0x00000100

peripherals:
  - {name: UART, base: 0xC0000000, id: 4}

# The files written from this map by `riscv-tools generate-memory-map` (`make generate`): the linker
# flags of the test programs and the linker script of the boot ROM. `make memory-map` checks they are up to date.
generate:
  specs: {path: src/simulation/internal-mem/runtime/rv32im-fpga.specs, rom: FLASH, ram: RAM, ram_limit: stdout}
  boot_ld: {path: src/simulation/internal-mem/runtime/boot_rom.ld}
  vhdl:
    path: src/simulation/internal-mem/rtl/internal_mem_map_pkg.vhd
    package: internal_mem_map_pkg
    rom: FLASH
    ram: RAM
    rom_external: false
    ram_external: false

# What the config.yaml of the platform reads from this map (`memory_map: platform.yaml`): the bases and
# the words of the memories, tohost and fromhost, and the address width of each simulation memory.
config:
  rom: FLASH
  ram: RAM
  addr_widths: [boot_rom, rom, ram]

checks:
  # --- config.yaml ---------------------------------------------------------

  # --- boot ROM (boot_rom.S; its linker script is generated) --------------
  - {name: boot_rom.S RAM end, file: src/simulation/internal-mem/runtime/boot_rom.S, pattern: '^\s*li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*$', expect: RAM.end}
  - {name: boot_rom.S stdout header, file: src/simulation/internal-mem/runtime/boot_rom.S, pattern: 'li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*// stdout header', expect: stdout.base}
  - {name: boot_rom.S FLASH_BASE, file: src/simulation/internal-mem/runtime/boot_rom.S, pattern: 'li\s+t0,\s*(0x[0-9A-Fa-f]+)\s*// FLASH_BASE', expect: boot.entry}
  - {name: boot_rom.S fromhost offset, file: src/simulation/internal-mem/runtime/boot_rom.S, pattern: '(-\d+)\(t0\)\s*// fromhost', expect: fromhost.base - RAM.end}
  - {name: boot_rom.S tohost offset, file: src/simulation/internal-mem/runtime/boot_rom.S, pattern: '(-\d+)\(t0\)\s*// tohost', expect: tohost.base - RAM.end}

  # --- runtime and Spike stand-in ------------------------------------------
  - {name: _exit.c tohost, file: src/simulation/internal-mem/runtime/_exit.c, pattern: '\(volatile unsigned int \*\)(0x[0-9A-Fa-f]+)u', expect: tohost.base}
  - {name: stdio.c STDOUT_BASE, file: src/simulation/internal-mem/runtime/stdio.c, pattern: '#define STDOUT_BASE (0x[0-9A-Fa-f]+)u', expect: stdout.base}
  - {name: spike_exit.S tohost, file: src/simulation/internal-mem/runtime/spike_exit.S, pattern: '\.equ tohost, (\S+)', expect: tohost.base}
  - {name: spike_exit.S fromhost, file: src/simulation/internal-mem/runtime/spike_exit.S, pattern: '\.equ fromhost, (\S+)', expect: fromhost.base}

  # --- VHDL of the core ----------------------------------------------------

  # --- Quartus IPs (only in RV32IM's tree) ---------------------------------
  # The Quartus wrappers hold a power of two (size_bytes); the BOOT_ROM region fills its IP, and the FLASH and RAM
  # regions leave the tail of the next power of two (32 KB for the 30 KB FLASH, 256 KB for the 160 KB RAM) unused.

  # --- the test programs' header (only in RV32IM's tree) ----------------------------------
  - {name: Tests header RV32_RAM_BASE, file: ../Tests/tools/riscv_build/include/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_BASE\s+(0x[0-9A-Fa-f]+)', expect: RAM.base}
  - {name: Tests header RV32_RAM_END, file: ../Tests/tools/riscv_build/include/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_END\s+(0x[0-9A-Fa-f]+)', expect: RAM.end}
  - {name: Tests header RV32_STDOUT_BASE, file: ../Tests/tools/riscv_build/include/rv32_platform.h, optional: true, pattern: '#define RV32_STDOUT_BASE\s+(0x[0-9A-Fa-f]+)', expect: stdout.base}
