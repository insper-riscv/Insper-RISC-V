# The memory map of the platform on the board (Cyclone V 5CEBA4F23, memories
# inside the FPGA): the source of truth `riscv-tools check-memory-map` checks
# every hand-written copy against.
#
#   uv run riscv-tools --root . check-memory-map --platform src/simulation/internal-mem/platform.yaml
#
# Paths in `checks` are relative to the root of this repository; `Core` and
# `Memory` are the submodules of this repository.
# The copies that the project running the tests owns (its config.yaml, the
# generated rv32_test.h) are not here: its memory section is this platform's
# config.yaml, extended, and the header is generated from it.
platform: internal-mem
# The profile of the platform: its base ISA (rv32i: 32 registers, rv32e: 16) and the extensions of the core.
# `--profile NAME` of riscv-tools replaces it for one run (a matrix of tests); `profiles` is the specification.
profile: rv32im_zicclsm_zicntr_zihpm
profiles: ../../../Core/profiles/matrix.yaml

regions:
  - {name: BOOT_MEMORY, base: 0x00000000, size: 4K,   kind: rom, exec: true}
  - {name: FLASH,    base: 0x00001000, size: 28K,  kind: rom, exec: true}
  - {name: RAM,      base: 0x00008000, size: 160K, kind: ram}

# Words at the top of RAM: the contract between the boot memory, the program and
# the host (platform/boot_memory.S clears them at every reset).
reserved:
  stdout:   {base: 0x0002FBE0, size: 1K+8}
  tohost:   {base: 0x0002FFE8, size: 8}
  fromhost: {base: 0x0002FFF0, size: 8}

boot:
  entry: 0x00001000
  wait_restart: 0x00000100

# An access to the padding of a peripheral window (what its registers do not take) is an access fault when true;
# the map package of the platform carries it as STRICT_PERIPH.
strict_periph: true

peripherals:
  - {name: UART, base: 0xC0000000, size: 1K}

# The memory model: both memories inside the chip, no cache. The package takes FLASH_ON_BUS and RAM_ON_BUS from here.
memory:
  rom:    {external: false}
  ram:    {external: false}
  icache: {enabled: false}
  dcache: {enabled: false}

# Extensions outside the matrix of the Core that the platform turns on (HAS_ZIMOP and HAS_ZICOND of the package).
extras: [Zimop, Zicond]

# The files written from this map by `riscv-tools generate-memory-map` (`make generate`): the linker
# flags of the test programs and the linker script of the boot memory. `make memory-map` checks they are up to date.
generate:
  specs: {path: src/simulation/internal-mem/runtime/rv32im-fpga.specs, rom: FLASH, ram: RAM, ram_limit: stdout}
  boot_ld: {path: src/simulation/internal-mem/runtime/boot_memory.ld}
  runtime: {path: src/simulation/internal-mem/runtime/memory_map.h, ram: RAM}
  vhdl:
    path: src/simulation/internal-mem/rtl/internal_mem_map_pkg.vhd
    package: internal_mem_map_pkg
    rom: FLASH
    ram: RAM
  # The constants of the platform for the whole design (ISA, address width, memory map in bytes, peripherals):
  # this file takes the place of the default config_pkg of the Common-Components in the source lists.
  config_pkg: {path: src/simulation/internal-mem/rtl/config_pkg.vhd}

# What the config.yaml of the platform reads from this map (`memory_map: platform.yaml`): the bases and
# the words of the memories, tohost and fromhost, and the address width of each simulation memory.
config:
  rom: FLASH
  ram: RAM
  addr_widths: [boot_memory, rom, ram]

checks:
  # --- config.yaml ---------------------------------------------------------

  # --- boot memory (boot_memory.S; its linker script is generated) --------------

  # --- runtime and Spike stand-in ------------------------------------------

  # --- VHDL of the core ----------------------------------------------------

  # --- Quartus IPs (only in RV32IM's tree) ---------------------------------
  # The Quartus wrappers hold a power of two (size_bytes); the BOOT_MEMORY region fills its IP, and the FLASH and RAM
  # regions leave the tail of the next power of two (32 KB for the 28 KB FLASH, 256 KB for the 160 KB RAM) unused.

  # --- the test programs' header (only in RV32IM's tree) ----------------------------------
  - {name: Tests header RV32_RAM_BASE, file: ../Tests/tools/riscv_build/include/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_BASE\s+(0x[0-9A-Fa-f]+)', expect: RAM.base}
  - {name: Tests header RV32_RAM_END, file: ../Tests/tools/riscv_build/include/rv32_platform.h, optional: true, pattern: '#define RV32_RAM_END\s+(0x[0-9A-Fa-f]+)', expect: RAM.end}
  - {name: Tests header RV32_STDOUT_BASE, file: ../Tests/tools/riscv_build/include/rv32_platform.h, optional: true, pattern: '#define RV32_STDOUT_BASE\s+(0x[0-9A-Fa-f]+)', expect: stdout.base}
