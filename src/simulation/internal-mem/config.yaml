# Configuration for the RISC-V test build/run pipeline.
#
# The "real" side is wired to src/simulation/internal-mem/quartus
# (core_fpga_test.qpf) — the only working core + Quartus project on
# this workstation. Lines still marked "<<< ADJUST" depend on things
# that vary per machine/runner (which JTAG cable, which self-hosted
# runner labels) — see README.md.

toolchain:
  # The RISC-V GCC insper-riscv/Infra's GCC_SETUP.md builds into
  # /opt/riscv-foundation (rv32im/ilp32, picolibc, one library variant),
  # on PATH through its wrappers.
  gcc: riscv32-unknown-elf-gcc
  objcopy: riscv32-unknown-elf-objcopy
  # The platform (memory map, crt0) is one GCC specs file. Tests link
  # against the toolchain's own picolibc, crt0 and picolibc.ld: this
  # project has no crt0 and no linker script of its own.
  specs: src/simulation/internal-mem/runtime/rv32im-fpga.specs

isa:
  base: i                    # always implied, never written in a test's header
  default_ext: ""            # no "// RV32_EXT:" header -> plain rv32i
  # Canonical order standard RISC-V extension letters get sorted into
  # before being appended to the base ISA string, so "// RV32_EXT: A,M"
  # and "// RV32_EXT: M,A" both normalize to rv32ima.
  canonical_order: "MAFDQLCBJTPVNH"

# The addresses and the sizes of the memories come from the map of the platform (platform.yaml): the BOOT_ROM,
# the FLASH and the RAM, the HTIF words tohost and fromhost, and the address width of each simulation memory
# (sim.parameters below). Nothing of the map is written here.
memory_map: platform.yaml

paths:
  # The platform's own parts of the runtime, compiled into every test:
  # the _exit the toolchain's crt0 ends in, and the write function of
  # stdout (a buffer in RAM the host reads over JTAG).
  sources:
    - src/simulation/internal-mem/runtime/_exit.c
    - src/simulation/internal-mem/runtime/stdio.c
  # The fixed, shared bootloader (see boot_rom.S's own header comment)
  # — built ONCE (not per test) into boot_rom.elf/.hex/.mif. It only
  # clears the fixed words and jumps to FLASH_BASE, where the crt0 is,
  # and holds rv32_wait_restart.
  boot_rom: src/simulation/internal-mem/runtime/boot_rom.S
  boot_rom_linker_script: src/simulation/internal-mem/runtime/boot_rom.ld

# Only needed by `riscv-tools freq-sweep` (Fmax search). The PLL has
# three outputs (clk_if/clk_idexmem/clk_wb), one frequency in three
# phases 0/120/240 degrees; the sweep rewrites all three together.
# Path is relative to this project's root (RV32IM's root is one level up).
freq_sweep:
  pll_file: src/simulation/internal-mem/pll/pll_0002.v
  phase_count: 3

quartus:
  # Points at RV32IM's real project — this repo (RISC-V-Workstation-
  # Tests) is vendored as RV32IM's own Tests/ submodule, so RV32IM's
  # root is one level up from this project's own root.
  project_dir: src/simulation/internal-mem/quartus
  project_name: core_fpga_test                     # core_fpga_test.qpf/.qsf
  sof_file: output_files/core_fpga_test.sof         # relative to project_dir
  # Path (relative to project_dir) the FLASH IP reads its initial
  # contents from at synthesis time. build_fpga.py overwrites this
  # file per test (BOOT_ROM has its own separate, one-time-only
  # target below — it does NOT get touched by the per-test flow).
  #
  # NOT ips/FLASH1PORT/init.mif (that's just where the IP's own
  # template copy lives) — flash1port.vhd's init_file generic is the
  # literal string "./init.mif", resolved relative to quartus_sh's cwd
  # (project_dir) at compile time, i.e. the top-level file here.
  # Confirmed (back when this was still the "ROM" IP) by dumping it
  # back over JTAG after overwriting the ips/ copy: the board kept
  # running an unrelated stale program (word9 == 0xDEAD0137, a
  # leftover from some earlier experiment) until this was pointed at
  # the right file.
  rom_mif_target: init.mif
  # BOOT_ROM's own init file — written ONCE as part of the initial
  # full compile (see paths.boot_rom/boot_rom_linker_script above),
  # never touched by the per-test JTAG rewrite flow build_fpga.py
  # normally uses (that flow only ever targets rom_mif_target/FLASH's
  # JTAG instance below).
  boot_rom_mif_target: boot_rom_init.mif
  # jtag_hardware isn't configured here: the "USB-Blaster [<bus>-<port>]"
  # suffix reflects USB topology and drifts across reboots/hub
  # renumbering (seen firsthand: "[1-4]" became "[1-10]" between two
  # runs on this same machine) — build_fpga.py detects it live via
  # `jtagconfig` instead. jtag_device is the FPGA's own JTAG IDCODE,
  # which doesn't change:
  jtag_device: "@1: 5CE(BA4|FA4) (0x02B050DD)"
  # Instance index Quartus' In-System Memory Content Editor assigns to
  # the RAM debug tap. The RAM is the only IP that declares
  # ENABLE_RUNTIME_MOD (see core_fpga_test.vhd), so it is instance 0;
  # the tohost and fromhost words live inside RAM and share its index.
  # BOOT_ROM and FLASH declare no ENABLE_RUNTIME_MOD, so they have NO
  # instance index: BOOT_ROM is only touched by the one-time full
  # compile+program (see boot_rom_mif_target above), and FLASH is a
  # single true dual-port copy that the JTAG loader rewrites per test.
  # Verify against the real quartus_map/fitter report if this
  # project's instantiation in core_fpga_test.vhd ever changes.
  ram_mem_instance: 0
  # How the host rewrites FLASH per test: the JTAG loader of the Memory
  # repository (flash_loader) holds the core in reset, writes the single
  # FLASH copy through the second port, checks the count and the checksum
  # and releases the core, which restarts from the BOOT_ROM by itself.
  # There is no In-System Memory Content Editor instance for the ROM.
  rom_write_method: jtag_loader
  rom_mem_instances: []
  # Fallback only: build_fpga.py compiles + quartus_pgm's ONCE, then
  # per test just JTAG-writes the new ROM image + writes fromhost_addr
  # (crt0.S jumps back to _start on its own — no recompile, no
  # reprogram). This full flow — quartus_sh --flow compile, then
  # quartus_pgm — only runs again if a test's tohost never responds
  # within its timeout (see build_tests.py's RV32_TIMEOUT_S header),
  # as a recovery path.
  program_wait_seconds: 15
  # How often to poll tohost while waiting (see
  # default_timeout_s / a test's own RV32_TIMEOUT_S header). Each poll
  # is its own quartus_stp subprocess (a fresh JTAG/In-System Memory
  # Editor session, opened and closed from scratch) — 0.5s let a
  # 15s-timeout test issue up to ~30 of these back to back, and that
  # volume of rapid session churn turned out to be unreliable on this
  # board (a genuine PASS/FAIL already sitting in tohost was
  # missed, reported as "no tohost result" instead — see
  # docs/DATA_HARVARD_BUG.md for how this was found and confirmed by
  # reading the same tohost word manually, once, with a real gap, and
  # getting the answer immediately). Fewer, more spaced-out polls
  # trade a bit of detection latency for reliability.
  poll_interval_seconds: 2.5
  # Default per-test timeout if a test doesn't set RV32_TIMEOUT_S.
  default_timeout_s: 15

sim:
  # Full-pipeline GHDL simulation top — NOT core_fpga_test (the real
  # hardware top): that one instantiates the real Quartus ROM1PORT/
  # RAM1PORT IP (altsyncram-based), which GHDL/cocotb can't peek
  # inside. rv32i3stage_core_sim_test instantiates ROM_simulation/
  # RAM_simulation instead — plain VHDL arrays cocotb can read.
  toplevel: rv32i3stage_core_sim_test
  # In dependency order (verified against tests/python/tests.json in
  # this same repo, which already builds this exact toplevel from
  # this exact source list for its instruction-level tests). Relative
  # to this project's own root, not RV32IM's (see quartus.project_dir
  # above for how the two relate).
  vhdl_sources:
    - Core/src/shared/pipeline_types.vhd
    - Core/src/shared/byte_mask_consts.vhd
    - Core/src/shared/opcode_consts.vhd
    - Core/src/shared/funct3_consts.vhd
    - Core/src/shared/funct7_consts.vhd
    - Core/src/shared/alu_consts.vhd
    - Core/src/shared/ext_imm_consts.vhd
    - Core/src/shared/ext_ram_consts.vhd
    - Core/src/shared/wb_sel_consts.vhd
    - Core/src/shared/pc_src_consts.vhd
    - Core/src/shared/mem_map_consts.vhd
    - Core/src/shared/fwd_consts.vhd
    - Core/src/shared/word_consts.vhd
    - Core/src/M/muldiv_consts.vhd
    - Core/src/Zicond/zicond_consts.vhd
    - Core/src/Zicsr/csr_value_consts.vhd
    - Core/src/Zicsr/trap_consts.vhd
    - Core/src/Zimop/zimop_consts.vhd
    - Common-Components/src/generic_register.vhd
    - Common-Components/src/adder.vhd
    - Common-Components/src/mux_2x1.vhd
    - Common-Components/src/mux_4x1.vhd
    - Common-Components/src/flip_flop.vhd
    - Common-Components/src/utils_pkg.vhd
    - Core/src/I-E/alu.vhd
    - Common-Components/src/onehot_decoder.vhd
    - Common-Components/src/mux_tree.vhd
    - Core/src/shared/reg_file.vhd
    - Core/src/I-E/extender_imm.vhd
    - Core/src/I-E/extender_ram.vhd
    - Core/src/I-E/store_manager.vhd
    - Core/src/Zicclsm/misaligned_unit.vhd
    - Core/src/shared/control_unit.vhd
    - Core/src/shared/bubble_mux.vhd
    - Core/src/shared/forwarding_match.vhd
    - Core/src/shared/forwarding_unit.vhd
    - Core/src/shared/hazard_detection_unit.vhd
    - Core/src/M/m_decode.vhd
    - Core/src/M/booth_multiplier_rv32.vhd
    - Core/src/M/non_restoring_divider_rv32.vhd
    - Core/src/M/muldiv_fusion.vhd
    - Core/src/M/multdiv.vhd
    - Core/src/Zicond/zicond_decode.vhd
    - Core/src/Zicond/zicond_unit.vhd
    - Core/src/Zicsr/csr_decode.vhd
    - Core/src/Zimop/zimop_decode.vhd
    - Core/src/Zicsr/csr_addr_consts.vhd
    - Core/src/Zicsr/csr_event_consts.vhd
    - Core/src/Zicntr/counter64.vhd
    - Core/src/Zicntr/tick_divider.vhd
    - Core/src/Zihpm/hpm_counter_bank.vhd
    - Core/src/Zicsr/csr_file.vhd
    - Core/src/Zicsr/trap_unit.vhd
    - Core/src/Zifencei/fencei_unit.vhd
    - Core/src/shared/pc_fetch.vhd
    - Core/src/shared/reg_if_id.vhd
    - Core/src/shared/reg_id_ex.vhd
    - Core/src/shared/reg_ex_mem.vhd
    - Core/src/shared/reg_mem_wb.vhd
    - Core/src/core/stage_if.vhd
    - Core/src/core/stage_id.vhd
    - Core/src/core/stage_ex.vhd
    - Core/src/core/stage_mem.vhd
    - Core/src/core/stage_wb.vhd
    - Core/src/core/core.vhd
    - Memory/src/RAM/SoC/ram_simulation.vhd
    - Memory/src/ROM/SoC/rom_simulation.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/uart2BusTop_pkg.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/baudGen.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/uartRx.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/uartTx.vhd
    - Peripherals/src/UART/serial/vendor/opencores_uart2bus/uartTop.vhd
    - Peripherals/src/UART/serial/uart.vhd
    - src/simulation/internal-mem/rtl/clk_gen_3way.vhd
    - src/simulation/internal-mem/rtl/internal_mem_map_pkg.vhd
    - src/simulation/internal-mem/rtl/rv32i3stage_core_sim_test.vhd
  # The cocotb testbench of the top lives in this repository; it is found
  # through python_path, which names it relative to the project that extends
  # this config.
  test_module: testbench.test_c_program
  python_path:
    - src/simulation/internal-mem
  env:
    # uart-errors exchanges a coordinated 32-byte RX/TX burst at 115200
    # baud. Five milliseconds leave room for that serial traffic plus boot;
    # short tests still return immediately when they write tohost.
    SIM_TIMEOUT_CYCLES: "500000"
  ghdl_std: "08"
  # ROM_simulation reads its program image via a VHDL generic (a
  # file-open process inside the VHDL itself), not sim_runner's own
  # ROM_HEX env var — see rv32i3stage_core_sim_test.vhd (two separate
  # ROM_simulation instances now, BOOT_ROM + FLASH). BOOT_ROM_FILE is
  # substituted from sim_runner.run_suite's boot_rom_hex_path (built
  # ONCE, see riscv_tools.boot_rom) — ROM_FILE (FLASH) still comes
  # from each test's own {hex_path} like before. The
  # boot_rom_addr_width/rom_addr_width/ram_addr_width generics size
  # each memory array to match memory.boot_rom_words/rom_words/
  # ram_words above — all three default to 2**9 (512 words) inside
  # rv32i3stage_core_sim_test.vhd, too small for this project's real
  # sizes.
  parameters:
    BOOT_ROM_FILE: "{boot_rom_hex_path}"
    ROM_FILE: "{hex_path}"
    HAS_ZICSR: true
    HAS_ZICNTR: true
    HAS_ZIHPM: true
    HAS_ZIMOP: true
    HAS_ZICOND: true

# Spike runs each test's own image, which starts at the crt0's _start.
# On the hardware that image ends in rv32_wait_restart, a routine of the
# separate boot ROM at 0x100, so Spike's ELF is built with a stand-in
# for it (platform/spike_exit.S: a wait loop, plus the
# tohost/fromhost symbols) and with -DRV32_SPIKE, which leaves the fixed
# address out of the link (see rv32im-fpga.specs).
emulator:
  sources:
    - src/simulation/internal-mem/runtime/spike_exit.S
  gcc_flags:
    - -DRV32_SPIKE
