# The memory map of the de2-115-n2 platform: the DE2-115 board at level N2, with every memory emulated inside the FPGA
# (the BOOT_MEMORY, the FLASH behind the instruction cache and the RAM behind the data cache, all in M9K blocks) and
# the console on the JTAG UART. It is the bring-up of the board before its own chips (SDRAM, FLASH NOR) are used: the
# size of the emulated memories stays under the ceiling of section 9 of the architecture document of the plan.
#
#   uv run riscv-tools --root . check-memory-map --platform src/cyclone-iv-e/de2-115-n2/platform.yaml
platform: de2-115-n2
# The board of the platform: `auto` asks for the identification by the JTAG; `boards` lists the boards it is built on.
board: auto
boards: [de2-115]
# The component of paths.yaml whose closure of `requires` is the source list of the generated project.
top: Insper-RISC-V/de2_115_n2_board
# The profile of the platform: its base ISA and the extensions of the core.
profile: rv32im_zicclsm_zicntr_zihpm_zifencei
profiles: ../../../Core/profiles/matrix.yaml

regions:
  - {name: BOOT_MEMORY, base: 0x00000000, size: 4K,   kind: rom, exec: true}
  - {name: FLASH,    base: 0x00001000, size: 252K, kind: rom, exec: true}
  - {name: RAM,      base: 0x40000000, size: 128K, kind: ram}   # emulated in M9K blocks

# Words at the top of RAM: the contract between the boot memory, the program and the host.
reserved:
  stdout:   {base: 0x4001FBE0, size: 1K+8}
  tohost:   {base: 0x4001FFE8, size: 8}
  fromhost: {base: 0x4001FFF0, size: 8}

boot:
  entry: 0x00001000
  wait_restart: 0x00000100

# The two banks of the FLASH for the program update: each starts with the 256-byte header page of the image
# (riscv-tools flash-image). Bank A [0x1000, 0x20000) and bank B [0x20000, 0x40000) are aligned to the 4 KiB sector.
flash:
  region: FLASH
  banks:
    - {name: A, base: 0x00001000, size: 124K}
    - {name: B, base: 0x00020000, size: 128K}

# The slots of the external interconnect (bits 30:28 of the address): the FLASH controller of the program update, the
# JTAG UART, the seven-segment display, the CLINT and the PLIC.
peripherals:
  - {name: FLASH_CTRL, base: 0xB0000000, id: 3}
  - {name: UART,    base: 0xC0000000, id: 4}
  - {name: DISPLAY, base: 0xD0000000, id: 5}
  - {name: CLINT,   base: 0xE0000000, id: 6}
  - {name: PLIC,    base: 0xF0000000, id: 7, size: 4M}

# The machine interrupts: MTIP and MSIP come from the CLINT, MEIP from the PLIC, all in the clock domain of the core.
interrupts:
  mtime_hz: 1000000
  plic: {priority_bits: 3}
  sources:
    - {name: UART_JTAG, id: 2}
    - {name: FLASH,     id: 6}

# The memory model: the FLASH is emulated with the latency of a serial chip and the RAM with a latency of two cycles,
# both outside the core behind the caches (32768 bits, 4 KiB).
memory:
  rom:    {external: true, backend: emulado, latency: {first: 24, next: 4}, sector_bytes: 4096}
  ram:    {external: true, backend: emulado, latency: {first: 2, next: 1}}
  icache: {enabled: true, size_bits: 32768}
  dcache: {enabled: true, size_bits: 32768}

# The clocks of the PLL (`riscv-tools board generate`). There is no `mem` clock: no memory chip of the board is used.
clocks:
  core:  {mhz: 50, phase_ps: 0}
  fetch: {mhz: 50, phase_ps: 0}

# The console is the JTAG UART (Virtual JTAG); the roles of inputs and outputs the platform wires.
console: jtag
io:
  leds:     {count: 18, need: required}
  switches: {count: 18, need: optional}
  keys:     {count: 4,  need: optional}
  display:  {count: 8,  need: optional}

# Extensions outside the matrix of the Core that the platform turns on.
extras: [Zimop, Zicond, Zihintntl, Zihintpause, Interrupts, Sscofpmf, AccessFaults]

# The files written from this map by `riscv-tools generate-memory-map` (`make generate`).
generate:
  specs: {path: src/cyclone-iv-e/de2-115-n2/runtime/rv32im-fpga.specs, rom: FLASH, ram: RAM, ram_limit: stdout}
  bank_specs:
    - {path: src/cyclone-iv-e/de2-115-n2/runtime/rv32im-fpga-bank-a.specs, rom: BANK_A_PAYLOAD, ram: RAM, ram_limit: stdout}
    - {path: src/cyclone-iv-e/de2-115-n2/runtime/rv32im-fpga-bank-b.specs, rom: BANK_B_PAYLOAD, ram: RAM, ram_limit: stdout}
  banks_h: {path: src/cyclone-iv-e/de2-115-n2/runtime/flash_banks.h}
  boot_ld: {path: src/cyclone-iv-e/de2-115-n2/runtime/boot_memory.ld}
  runtime: {path: src/cyclone-iv-e/de2-115-n2/runtime/memory_map.h, ram: RAM}
  vhdl:
    path: src/cyclone-iv-e/de2-115-n2/de2_115_n2_map_pkg.vhd
    package: de2_115_n2_map_pkg
    rom: FLASH
    ram: RAM

# What the config.yaml of the platform reads from this map (`memory_map: platform.yaml`).
config:
  rom: FLASH
  ram: RAM
  addr_widths: [boot_memory, rom, ram]

checks:
  - {name: config.yaml UART_SLOT, file: src/cyclone-iv-e/de2-115-n2/config.yaml, pattern: 'UART_SLOT: "(\d+)"', expect: UART.id}
