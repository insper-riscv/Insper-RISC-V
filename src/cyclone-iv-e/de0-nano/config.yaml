# The de0-nano platform: the Terasic DE0-Nano (Cyclone IV E) with the reduced profile (RV32I with Zicsr), the FLASH
# emulated in the M9K blocks and the 32 MB SDRAM as the RAM, behind two small caches. It is the de0-cv platform with the other
# map (platform.yaml), the other runtime and the project that `board generate` writes for the board; the simulation of the
# SoC is the one of the modular platform.
extends: ../../cyclone-v/de0-cv/config.yaml

toolchain:
  specs: src/cyclone-iv-e/de0-nano/runtime/rv32im-fpga-bank-a.specs

# The addresses and the sizes come from the map of the platform.
memory_map: platform.yaml

paths:
  sources:
    - src/cyclone-iv-e/de0-nano/runtime/_exit.c
    - src/cyclone-iv-e/de0-nano/runtime/stdio.c
  boot_memory: src/cyclone-iv-e/de0-nano/runtime/boot_memory.S
  boot_memory_linker_script: src/cyclone-iv-e/de0-nano/runtime/boot_memory.ld

emulator:
  sources:
    - src/cyclone-iv-e/de0-nano/runtime/spike_exit.S

quartus:
  # The project is written by `board generate` from platform.yaml and the board package (boards/de0-nano).
  generate: {platform: src/cyclone-iv-e/de0-nano/platform.yaml, out: build, boards_dir: boards, chips_dir: Memory/chips}
  project_dir: build/de0-nano-de0-nano
  project_name: de0_nano_de0_nano
  sof_file: output_files/de0_nano_de0_nano.sof
  # The device of the chain of the board, which the cable check compares with the IDCODE it reads.
  jtag_device: '@1: 10CL025(Y|Z)/EP3C25/EP4CE22 (0x020F30DD)'
