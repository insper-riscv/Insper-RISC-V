# Plataforma de exemplo dos perifericos externos da placa de2-115: cada kind que o board.yaml oferece, com base e size absolutos e sem sobreposicao. Esquema: docs/pt-br/boards/formato.md e docs/pt-br/boards/perifericos-por-placa.md.
platform: de2-115-periph
board: auto
boards: [de2-115]
# O componente do paths.yaml cujo fecho de `requires` é a lista de fontes do projeto gerado.
top: Insper-RISC-V/periph_de2_115_board
core:
  type: 32
  base: I
  extensions:
    - M
    - Zicclsm
    - Zicntr
    - Zihpm
    - Zifencei
    - Zimop
    - Zicond
    - Zihintntl
    - Zihintpause
    - Interrupts
    - Sscofpmf
profiles: ../../../Core/profiles/matrix.yaml
memory:
  boot:
    base: 0x00000000
    size: 4K
  instructions:
    - type: emulated
      base: 0x00001000
      size: 28K
      on_bus: true
      latency: {first: 24, next: 4}
      sector_bytes: 4096
      cache:
        size_bits: 32768
  data:
    - type: emulated
      base: 0x40000000
      size: 64K
      on_bus: true
      cache:
        size_bits: 32768

reserved:
  stdout:   {base: 0x4000FBE0, size: 1K+8}
  tohost:   {base: 0x4000FFE8, size: 8}
  fromhost: {base: 0x4000FFF0, size: 8}
boot:
  entry: 0x00001000
  wait_restart: 0x00000100
clocks:
  core: {mhz: 50, phase_ps: 8250}
  mem:  {mhz: 100}
console: jtag
io:
  leds: {count: 18, need: required}
  display: {count: 8, need: optional}
generate:
  vhdl: {path: src/periph-examples/de2-115/de2_115_periph_map_pkg.vhd, package: de2_115_periph_map_pkg, rom: FLASH, ram: RAM}
  # The constants of the platform for the whole design (ISA, address width, memory map in bytes, peripherals):
  # this file takes the place of the default config_pkg of the Common-Components in the source lists.
  config_pkg: {path: src/periph-examples/de2-115/config_pkg.vhd}
# An access to the padding of a peripheral window (what its registers do not take) is an access fault when true;
# the map package of the platform carries it as STRICT_PERIPH.
strict_periph: true

peripherals:
  FLASH_CTRL:
    base: 0xB0000000
    size: 32
  UART:
    base: 0xC0000000
    size: 1K
  DISPLAY:
    base: 0xD0000000
    size: 1K
  CLINT:
    base: 0xE0000000
    size: 64K
  PLIC:
    base: 0xF0000000
    size: 4M
  GPIO: {kind: gpio, role: gpio, base: 0x80001000, groups: [[0, 1, 2, 3, 4, 5, 6, 7]]}
  KBD:    {kind: ps2, device: keyboard, base: 0x80007000}
  MOUSE:  {kind: ps2, device: mouse, base: 0x80007100}
  SD:     {kind: sd_native, base: 0x80008000}
  IR:     {kind: ir, base: 0x80009000}
  LCD:    {kind: lcd, base: 0x8000A000}
  USB:    {kind: usb, base: 0x8000B000}
  I2C0:   {kind: i2c, base: 0x8000C000}
  I2C1:   {kind: i2c, base: 0x8000C100}
  AUDIO:  {kind: audio, base: 0x8000D000}
  ETH0:   {kind: eth, base: 0x8000E000}
  ETH1:   {kind: eth, base: 0x8000E100}
  TV:     {kind: tv, base: 0x8000F000}
  SERIAL: {kind: uart, base: 0x80220000, has_flow_control: true}

interrupts:
  clock_hz: 50000000
  mtime_hz: 1000000
  plic: {priority_bits: 3}
  sources:
    - {name: UART_JTAG, id: 2}
    - {name: FLASH,     id: 6}
