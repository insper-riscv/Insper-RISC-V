[package]
name = "rv32-app"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1


# Bare-metal firmware has no host test/benchmark harness.
[[bin]]
name = "rv32-app"
path = "src/main.rs"
test = false
bench = false

# Firmware projects remain independent when created inside another Cargo tree.
[workspace]

[dependencies]
insper-riscv-clint = { path = "vendor/CLINT/rust/insper-riscv-clint" }
insper-riscv-display = { path = "vendor/DISPLAY/rust/insper-riscv-display" }
insper-riscv-gpio = { path = "vendor/GPIO/rust/insper-riscv-gpio" }
insper-riscv-plic = { path = "vendor/PLIC/rust/insper-riscv-plic" }
insper-riscv-timer = { path = "vendor/TIMER/rust/insper-riscv-timer" }
insper-riscv-uart = { path = "vendor/UART/rust/insper-riscv-uart" }
rv32-runtime = { path = "vendor/rv32-runtime" }
