# Files left out of `riscv-tools check-vhdl-style`: the behavioral stand-in of the generated PLL keeps the
# port names of src/simulation/internal-mem/pll/pll.vhd (Quartus IP, itself exempt), because the hardware top
# instantiates either of the two by the same names.
tree:
  coverage:
    formal:
      ext_interconnect: []
  vhdl_style:
    exclude: [src/simulation/internal-mem/pll/pll_sim.vhd]
