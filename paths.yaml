# Files left out of `riscv-tools check-vhdl-style`: the behavioral stand-in of the generated PLL keeps the
# port names of src/simulation/internal-mem/pll/pll.vhd (Quartus IP, itself exempt), because the hardware top
# instantiates either of the two by the same names.
tree:
  coverage:
    formal:
      ext_interconnect: []
  vhdl_style:
    exclude: [src/simulation/internal-mem/pll/pll_sim.vhd]

provides:
  # Each component lists its sources in GHDL dependency order and the components it needs. A requires of the form
  # <repository>/<component> names a component of a submodule (Common-Components, Core, Memory, Peripherals).
  # The tops are the components named *_top, *_sim_top and core_fpga_test; riscv-tools sources Insper-RISC-V/<top>
  # lists their files. core_fpga_test instantiates the PLL, and the PLL is not a requirement of it because the
  # simulation analyzes pll_sim and the board pll_ip: list the PLL first, as in "sources pll_sim core_fpga_test".
  clk_gen_3way:
    requires: []
    sources:
      - src/simulation/internal-mem/rtl/clk_gen_3way.vhd
  ext_interconnect:
    requires: []
    sources:
      - src/interconnect/ext_interconnect.vhd
  axi_interconnect:
    requires: [Memory/axi_master_bridge, Memory/dcache]
    sources:
      - src/interconnect/axi_router.vhd
      - src/interconnect/axi_slave_periph_bank.vhd
      - src/interconnect/ext_axi_interconnect.vhd
  internal_mem_map:
    requires: []
    sources:
      - src/simulation/internal-mem/rtl/internal_mem_map_pkg.vhd
  blinky:
    requires: []
    sources:
      - src/simulation/internal-mem/rtl/Blinky.vhd
  pll_ip:
    requires: []
    sources:
      - src/simulation/internal-mem/pll/pll.vhd
  pll_sim:
    requires: []
    sources:
