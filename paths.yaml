# Every file path this repository references, checked by
#   riscv-tools --root . check-paths --manifest paths.yaml
# and by `make paths`. Run it before and after moving any file.
references:
  - {name: submodules and entry points, paths: [Common-Components, Core, Memory, Peripherals, scripts/kpi_report.py, scripts/compare_kpis.py]}
  - {name: standard files, paths: [README.md, README.en.md, CONTRIBUTING.md, CONTRIBUTING.en.md, AUTHORS.md, AUTHORS.en.md, CITATION.cff, LICENSE]}
  - {name: platforms, paths: [src/simulation/internal-mem/platform.yaml, src/cyclone-v/de0-cv/platform.yaml]}
  # The platform configs are written relative to the root of this repository, `base: .`.
  - {name: sim sources, file: src/simulation/internal-mem/config.yaml, yaml: sim.vhdl_sources, base: .}
  - {name: hardware-top sim sources, file: src/simulation/internal-mem/config.fpga-sim.yaml, yaml: sim.vhdl_sources, base: .}
  - {name: sim python_path, file: src/simulation/internal-mem/config.yaml, yaml: sim.python_path, base: .}
  - {name: runtime sources, file: src/simulation/internal-mem/config.yaml, yaml: paths.sources, base: .}
  - {name: boot ROM, file: src/simulation/internal-mem/config.yaml, yaml: paths.boot_rom, base: .}
  - {name: boot ROM linker script, file: src/simulation/internal-mem/config.yaml, yaml: paths.boot_rom_linker_script, base: .}
  - {name: toolchain specs, file: src/simulation/internal-mem/config.yaml, yaml: toolchain.specs, base: .}
  - {name: Spike stand-in, file: src/simulation/internal-mem/config.yaml, yaml: emulator.sources, base: .}
  - {name: PLL for freq-sweep, file: src/simulation/internal-mem/config.yaml, yaml: freq_sweep.pll_file, base: .}
  - {name: Quartus project dir, file: src/simulation/internal-mem/config.yaml, yaml: quartus.project_dir, base: .}
  - {name: board project (core_fpga_test.qsf), file: src/simulation/internal-mem/quartus/core_fpga_test.qsf, pattern: '-name (?:VHDL_FILE|VERILOG_FILE|QIP_FILE|SDC_FILE) (\S+)'}
  - {name: Quartus IPs of the PLL, paths: [src/simulation/internal-mem/pll/pll.qip, src/simulation/internal-mem/pll/pll_0002.qip]}
  - {name: per-entity tests.json, file: tests/python/tests.json, yaml: "*.sources", base: .}
  - {name: de0-cv sim sources, file: src/cyclone-v/de0-cv/config.yaml, yaml: sim.vhdl_sources, base: .}
  - {name: de0-cv sim python_path, file: src/cyclone-v/de0-cv/config.yaml, yaml: sim.python_path, base: .}
  - {name: de0-cv runtime sources, file: src/cyclone-v/de0-cv/config.yaml, yaml: paths.sources, base: .}
  - {name: de0-cv boot ROM, file: src/cyclone-v/de0-cv/config.yaml, yaml: paths.boot_rom, base: .}
  - {name: de0-cv boot ROM linker script, file: src/cyclone-v/de0-cv/config.yaml, yaml: paths.boot_rom_linker_script, base: .}
  - {name: de0-cv toolchain specs, file: src/cyclone-v/de0-cv/config.yaml, yaml: toolchain.specs, base: .}
  - {name: de0-cv Spike stand-in, file: src/cyclone-v/de0-cv/config.yaml, yaml: emulator.sources, base: .}
  - {name: de0-cv Quartus project dir, file: src/cyclone-v/de0-cv/config.yaml, yaml: quartus.project_dir, base: .}
  - {name: de0-cv board project (de0-cv.qsf), file: src/cyclone-v/de0-cv/de0-cv.qsf, pattern: '-name (?:VHDL_FILE|VERILOG_FILE|QIP_FILE|SDC_FILE) (\S+)'}
  - {name: modular top and its images, paths: [src/simulation/modular/modular_sim_top.vhd, src/simulation/modular/platform.yaml, src/simulation/modular/modular_map_pkg.vhd, tests/python/gen_modular_images.py, tests/python/unittests/rtl/data/modular/boot_to_rom.hex, tests/python/unittests/rtl/data/modular/rom_program.hex, tests/python/unittests/rtl/modular_common.py, tests/python/unittests/rtl/modular_integrated.py, tests/python/unittests/rtl/modular_external_data.py, tests/python/unittests/rtl/modular_external_instruction.py, tests/python/unittests/rtl/modular_external.py, docs/pt-br/platform/modular.md, docs/en/platform/modular.md]}
  - {name: bus integration tests, paths: [src/interconnect/ext_interconnect.vhd, src/interconnect/ext_axi_interconnect.vhd, src/interconnect/axi_router.vhd, src/interconnect/axi_slave_periph_bank.vhd, tests/python/unittests/integration/axi_router.py, tests/vhdl/ext_bus_system.vhd, tests/vhdl/ext_axi_bus_system.vhd, tests/python/unittests/integration/ext_bus.py, tests/python/unittests/integration/ext_axi_cache.py, tests/python/unittests/integration/jtag.py, tests/python/unittests/integration/checks.py, tests/python/unittests/integration/dut.py]}
